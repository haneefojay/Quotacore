# Publishes the metrics listener for a scraper outside the container (IP-15 D20, deployment.md
# section 1). The default file does not, because the scrape is unauthenticated and the loopback bind
# is its control (deployment.md section 4.1, QUOTACORE_METRICS_ADDR):
#
#   docker compose -f docker-compose.yml -f docker-compose.metrics.yml up -d --wait
#   curl -sS http://127.0.0.1:9090/metrics
#
# Inside the container the listener then binds every interface, so the service's start-up warning
# for a metrics address that is not loopback fires, and is true. On the host it is published on
# loopback only, like the API.
services:
  quotacore:
    environment:
      QUOTACORE_METRICS_ADDR: 0.0.0.0:9090
    ports:
      - "127.0.0.1:9090:9090"
