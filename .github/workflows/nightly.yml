name: nightly

# The nightly suites against a real stack: the reference workflow (IP-15 DoD 5, the restore drill),
# and IP-16's heavy suites: load, chaos, the clock pair, T-11 and the property tests at scale. The
# soak runs weekly, because it takes 5 h 30 m of a 6 h job (IP-16 D4). GitHub runs a schedule only
# from the default branch, so this starts running once it is on main; until then full-suite.yml runs
# the same suites on a labelled pull request.

on:
  schedule:
    - cron: '17 3 * * *'
    # Sunday's run adds the soak.
    - cron: '17 1 * * 0'
  workflow_dispatch:
    inputs:
      soak:
        description: Run the soak as well
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  reference:
    if: github.event.schedule != '17 1 * * 0'
    uses: ./.github/workflows/reference.yml

  heavy:
    uses: ./.github/workflows/heavy.yml
    with:
      soak: ${{ github.event.schedule == '17 1 * * 0' || inputs.soak == true }}
