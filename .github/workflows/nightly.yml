name: nightly

# The restore drill nightly against a real stack (IP-15 DoD 5): the reference workflow, on a
# schedule and on demand. GitHub runs a schedule only from the default branch, so this starts
# running nightly once it is on main.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    uses: ./.github/workflows/reference.yml
