# CI's additions to the reference file, for the integration suite only (IP-15). The stores sit on
# the reference file's internal network, which Docker publishes no port from, so each also joins
# the published network here to reach a loopback port on the runner. The reference deployment
# publishes neither (docker-compose.yml).
services:
  postgres:
    ports:
      - "127.0.0.1:15432:5432"
    networks: [internal, published]

  # IP-04's integration tests talk to the real datastore, so CI publishes it to the host on a
  # loopback port the same way it publishes Postgres.
  valkey:
    ports:
      - "127.0.0.1:16379:6379"
    networks: [internal, published]

  # A second store that the tests which fill or reconfigure a store may change, so the shared one
  # is never left full or under another policy (QUOTACORE_SCRATCH_REDIS_URL).
  valkey-scratch:
    image: valkey/valkey:8@sha256:8f836008e0986c36adf50da714c7060cf689dbb335f61fe077939d90fa650809
    command: ["--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:16380:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [published]
