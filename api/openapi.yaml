openapi: 3.1.0

info:
  title: Quotacore
  version: 0.1.0
  summary: Quota and metering enforcement for AI SaaS.
  description: |
    Quotacore is a quota service. It holds a balance per tenant, per feature, and answers
    whether a call is allowed before the call is made, or applies it after.

    This document is the source of truth for the wire format. It is generated from
    `docs/architecture/api-conventions.md` and `docs/product/error-catalog.md`, not from the
    code, and the types and request validation in the service are generated from this file
    (ADR-0010). A disagreement between this file and those documents is a defect in whichever
    one was edited last.

    **Conventions that hold on every route in this document.**

    - Every response carries `X-Request-Id`, and the `request_id` in an error body equals it
      (NFR-S10). Quote it in a bug report.
    - Every error body is the same envelope, and `code` is the only field to branch on. The HTTP
      status is a class hint; `429` in particular means two different things, which is
      `quota_exceeded` and `rate_limited` (DR-040).
    - `Idempotency-Key` is required on `POST /v1/consume` and `POST /v1/refund` and on nothing
      else. There is no server-generated fallback, because a generated key silently defeats the
      purpose.
    - Amounts are JSON integers, never floats. A float is `400 validation_failed` naming the
      field.
    - Timestamps are RFC 3339 **with an explicit offset**, always, including `Z`. A client never
      has to branch on whether the zone is UTC.
    - `cycle_start` and `cycle_end` are `null` together, for a `never` entitlement. That is the
      documented shape, not an omission (DR-008, INV-C6).
    - A request with an undeclared field is `400 validation_failed`. Every object in this
      document sets `additionalProperties: false`, which is what makes a typo a clear error
      instead of a silently ignored key.
    - Validation errors aggregate. Three bad fields produce one `validation_failed` naming all
      three, in `details.errors`.

    **Two guarantees worth reading before integrating.**

    A `500` on `consume` or `refund` always means the balance is unchanged. The mutation is a
    single atomic script execution, so there is no state in which a deduction was partially
    applied, and a client-side retry after a `500` is safe.

    A retry with the *same* `Idempotency-Key` is charged once, within 24 hours of the first
    application. A retry with a *new* key is a second operation and is charged twice. No
    server-side scheme detects that (FS-03).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: Quotacore
    url: https://github.com/quotacore/quotacore

servers:
  - url: http://localhost:8080
    description: Local development, the default in `docker compose up`
  - url: https://{host}
    description: A deployment of your own
    variables:
      host:
        default: quota.example.com
        description: The host serving this instance

security:
  - bearerAuth: []

tags:
  - name: data-plane
    description: |
      The four routes a customer's application calls on the request path. These are the ones
      with a latency budget, and the ones that open no database connection.
  - name: admin-features
    description: The catalogue of metered features. A feature is a key, a unit and a name.
  - name: admin-plans
    description: Plans and their entitlements. A plan is an offer; a tenant override is a contract term.
  - name: admin-tenants
    description: Tenants, their plan assignment, grants, overrides and usage history.
  - name: admin-keys
    description: API key issuance and revocation. A key is never readable after issue.
  - name: admin-observe
    description: Status and audit. The two routes an operator reads when something is wrong.
  - name: operational
    description: |
      Probes, metrics and this document. No error envelope, and the probes need no
      credential.

paths:
  /v1/consume:
    post:
      tags: [data-plane]
      security:
        - bearerAuth: []
      x-required-scope: runtime
      operationId: consume
      summary: Deduct an amount from the current cycle's balance
      description: |
        The call a customer's application makes instead of decrementing a counter itself.

        `Idempotency-Key` is required. The same key replayed with the same
        `operation | tenant | feature | amount` returns the original response byte for byte with
        `replayed: true`, and the same key with a different fingerprint is
        `409 idempotency_key_reuse` with no state change at all (DR-028, INV-I2).

        The window is 24 hours from the first application. A key first seen after that is a new
        operation, not a replay (DR-029). The window is fixed and is not configurable, because it
        is a documented customer guarantee.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeteredRequest'
            examples:
              metered:
                summary: 4200 output tokens
                value:
                  feature_key: llm.tokens.output
                  amount: 4200
                  tenant_external_id: acme-prod-01
                  metadata:
                    model: claude-opus-5
                    conv: c_9f3a
      responses:
        '200':
          $ref: '#/components/responses/MeteredOK'
        '400':
          $ref: '#/components/responses/ErrorBadRequestMetered'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenEntitlement'
        '404':
          $ref: '#/components/responses/ErrorTenantNotFound'
        '409':
          $ref: '#/components/responses/ErrorIdempotencyKeyReuse'
        '413':
          $ref: '#/components/responses/ErrorPayloadTooLarge'
        '429':
          $ref: '#/components/responses/ErrorQuotaAndRate'
        '500':
          $ref: '#/components/responses/ErrorInternal'
        '503':
          $ref: '#/components/responses/ErrorUnavailable'

  /v1/refund:
    post:
      tags: [data-plane]
      security:
        - bearerAuth: []
      x-required-scope: runtime
      operationId: refund
      summary: Return an amount to the current cycle's balance
      description: |
        A refund is its own operation, not a negative consume. The direction is the endpoint and
        never a sign (DR-023, ADR-0005), so a refund can never be confused with a malformed
        amount.

        `Idempotency-Key` is required, on the same 24-hour window as `consume`.

        A refund never returns `quota_exceeded`. A refund cannot exceed a balance; the bound it
        can break is `balance <= limit + bonus`, which is `refund_exceeds_grant` (DR-019). If the
        intent is a permanent increase, use an admin `grant` instead.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeteredRequest'
            examples:
              metered:
                summary: Return 400 tokens after a retry
                value:
                  feature_key: llm.tokens.output
                  amount: 400
                  tenant_external_id: acme-prod-01
      responses:
        '200':
          $ref: '#/components/responses/MeteredOK'
        '400':
          $ref: '#/components/responses/ErrorBadRequestMetered'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenEntitlement'
        '404':
          $ref: '#/components/responses/ErrorTenantNotFound'
        '409':
          $ref: '#/components/responses/ErrorRefundConflict'
        '413':
          $ref: '#/components/responses/ErrorPayloadTooLarge'
        '429':
          $ref: '#/components/responses/ErrorRateLimited'
        '500':
          $ref: '#/components/responses/ErrorInternal'
        '503':
          $ref: '#/components/responses/ErrorUnavailable'

  /v1/check:
    post:
      tags: [data-plane]
      security:
        - bearerAuth: []
      x-required-scope: runtime
      operationId: check
      summary: Ask whether an amount would be allowed
      description: |
        Advisory. Returns `200` with `allowed: false` when the answer is no; a denial here is
        **not** a `429` (DR-024). A `429` from this route means the *service* is rate-limiting
        you, which is a different problem with a different remedy (DR-040).

        No `Idempotency-Key`, because nothing is mutated, so a duplicate is harmless
        (DR-024). This route never returns `idempotency_key_reuse`.

        It is `POST` rather than `GET` because the question is in a body, and a `GET` with a body
        is not portable. The verb is `check` and not `quote` because it reserves nothing.

        The limitation is stated here as well as in the reference, because ignoring it looks like
        a bug the first time a customer hits it: two requests can both pass `check` and one can
        then be denied at `consume`. `check` reduces denials, it does not eliminate the race.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeteredRequest'
            examples:
              metered:
                summary: Would 1000 tokens fit?
                value:
                  feature_key: llm.tokens.output
                  amount: 1000
                  tenant_external_id: acme-prod-01
      responses:
        '200':
          $ref: '#/components/responses/CheckOK'
        '400':
          $ref: '#/components/responses/ErrorBadRequestWindow'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenEntitlement'
        '404':
          $ref: '#/components/responses/ErrorTenantNotFound'
        '429':
          $ref: '#/components/responses/ErrorRateLimited'
        '500':
          $ref: '#/components/responses/ErrorInternal'
        '503':
          $ref: '#/components/responses/ErrorUnavailable'

  /v1/balance:
    get:
      tags: [data-plane]
      security:
        - bearerAuth: []
      x-required-scope: runtime
      operationId: balance
      summary: Read the balances of a tenant
      description: |
        With `feature_key`, one entry. Without it, the tenant's full set, which is bounded by the
        plan's entitlement count (NFR-T5), so the unbounded case does not exist. `feature_key` is
        optional.

        `cycle_start` and `cycle_end` are always present and are `null` together for a `never`
        entitlement.

        An unknown feature key on this route is `404 feature_not_found`. This is the admin-plane
        behaviour and it is the one documented exception to the data plane's non-disclosure rule:
        the caller already knows a key it is asking about, and `feature_not_in_plan` would be
        indistinguishable from an exhausted allowance, which is the distinction the caller most
        needs (FS-17).
      parameters:
        - $ref: '#/components/parameters/TenantExternalIdQuery'
        - $ref: '#/components/parameters/FeatureKeyQuery'
      responses:
        '200':
          $ref: '#/components/responses/BalanceOK'
        '400':
          $ref: '#/components/responses/ErrorBadRequestPlain'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenScope'
        '404':
          $ref: '#/components/responses/ErrorNotFoundResource'
        '429':
          $ref: '#/components/responses/ErrorRateLimited'
        '500':
          $ref: '#/components/responses/ErrorInternal'
        '503':
          $ref: '#/components/responses/ErrorUnavailable'

  /v1/admin/features:
    get:
      tags: [admin-features]
      operationId: listFeatures
      summary: List the feature catalogue
      description: |
        The whole catalogue is small by construction, so this returns everything rather than a
        page. A feature is a key, a unit and a name, and the unit is what an `amount` counts.
      security:
        - bearerAuth: []
      x-required-scope: admin
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/FeatureListOK'
        '400':
          $ref: '#/components/responses/ErrorBadRequestPlain'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenScope'
        '501':
          $ref: '#/components/responses/ErrorNotImplemented'
    post:
      tags: [admin-features]
      operationId: createFeature
      summary: Create a feature
      description: |
        `key` and `unit` are immutable once the feature is referenced, because reinterpreting a
        historical amount is not allowed. The two have distinct error codes for that reason
        (INV-F2, INV-F3); `feature_unit_immutable` is on this cell because a create that races an
        assignment is the case the DDL cannot catch.
      security:
        - bearerAuth: []
      x-required-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureCreate'
            examples:
              feature:
                summary: An output-token feature
                value:
                  feature_key: llm.tokens.output
                  name: LLM output tokens
                  unit: token
                  description: Completion tokens billed to the customer
      responses:
        '201':
          $ref: '#/components/responses/FeatureCreated'
        '400':
          $ref: '#/components/responses/ErrorBadRequestPlain'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenScope'
        '409':
          $ref: '#/components/responses/ErrorConflictFeature'
        '413':
          $ref: '#/components/responses/ErrorPayloadTooLarge'
        '501':
          $ref: '#/components/responses/ErrorNotImplemented'

  /v1/admin/features/{feature_key}:
    parameters:
      - $ref: '#/components/parameters/FeatureKeyPath'
    get:
      tags: [admin-features]
      operationId: getFeature
      summary: Read one feature
      security:
        - bearerAuth: []
      x-required-scope: admin
      responses:
        '200':
          $ref: '#/components/responses/FeatureOK'
        '400':
          $ref: '#/components/responses/ErrorBadRequestPlain'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenScope'
        '404':
          $ref: '#/components/responses/ErrorFeatureNotFound'
        '501':
          $ref: '#/components/responses/ErrorNotImplemented'
    patch:
      tags: [admin-features]
      operationId: updateFeature
      summary: Rename a feature
      description: |
        `version` is required and is the optimistic-concurrency token. A mismatch is
        `409 resource_version_conflict` with the current version in `details`, so a client can
        re-read and retry deliberately. Last-write-wins on a resource that governs a customer's
        money is not acceptable, and an operator with two open browser tabs is exactly the case
        (FS-12).

        `unit` is absent from this body on purpose. It is immutable, so offering the field and
        then refusing it would be a worse API than not offering it.
      security:
        - bearerAuth: []
      x-required-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureUpdate'
            examples:
              rename:
                summary: Correct a display name
                value:
                  version: 3
                  name: LLM output tokens (completion)
      responses:
        '200':
          $ref: '#/components/responses/FeatureOK'
        '400':
          $ref: '#/components/responses/ErrorBadRequestPlain'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenScope'
        '404':
          $ref: '#/components/responses/ErrorFeatureNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflictFeature'
        '413':
          $ref: '#/components/responses/ErrorPayloadTooLarge'
        '501':
          $ref: '#/components/responses/ErrorNotImplemented'

  /v1/admin/features/{feature_key}/archive:
    parameters:
      - $ref: '#/components/parameters/FeatureKeyPath'
    post:
      tags: [admin-features]
      operationId: archiveFeature
      summary: Archive a feature
      description: |
        Archiving, not deleting. A feature referenced by a plan, a tenant or a historical event
        may be archived but not deleted, so the audit and event history never dangles (DR-016).

        Archiving denies new consumption with `403 feature_archived` and leaves existing balances
        intact until their natural cycle end. A zeroed balance would be a lie about money the
        customer has already paid for.
      security:
        - bearerAuth: []
      x-required-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveRequest'
            examples:
              archive:
                summary: Retire an unused feature
                value:
                  version: 1
                  reason: replaced by llm.tokens.total
      responses:
        '200':
          $ref: '#/components/responses/FeatureOK'
        '400':
          $ref: '#/components/responses/ErrorBadRequestPlain'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenScope'
        '404':
          $ref: '#/components/responses/ErrorFeatureNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflictFeature'
        '413':
          $ref: '#/components/responses/ErrorPayloadTooLarge'
        '501':
          $ref: '#/components/responses/ErrorNotImplemented'

  /v1/admin/plans:
    get:
      tags: [admin-plans]
      operationId: listPlans
      summary: List plans
      security:
        - bearerAuth: []
      x-required-scope: admin
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/PlanListOK'
        '400':
          $ref: '#/components/responses/ErrorBadRequestPlain'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenScope'
        '409':
          $ref: '#/components/responses/ErrorConflictPlan'
    post:
      tags: [admin-plans]
      operationId: createPlan
      summary: Create a plan
      description: |
        A plan is bounded at 100 entitlements, and the bound is a documented validation limit
        rather than a struct size (NFR-T5), so a larger plan is a validation error rather than a
        slow request.
      security:
        - bearerAuth: []
      x-required-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanCreate'
            examples:
              plan:
                summary: A two-feature plan
                value:
                  plan_key: pro
                  name: Pro
                  entitlements:
                    - feature_key: llm.tokens.output
                      limit: 1000000
                      reset_interval: monthly
                    - feature_key: api.requests
                      limit: 100000
                      reset_interval: monthly
      responses:
        '201':
          $ref: '#/components/responses/PlanCreated'
        '400':
          $ref: '#/components/responses/ErrorBadRequestPlain'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenScope'
        '409':
          $ref: '#/components/responses/ErrorConflictPlan'
        '413':
          $ref: '#/components/responses/ErrorPayloadTooLarge'

  /v1/admin/plans/{id}:
    parameters:
      - $ref: '#/components/parameters/PlanIdPath'
    get:
      tags: [admin-plans]
      operationId: getPlan
      summary: Read one plan
      security:
        - bearerAuth: []
      x-required-scope: admin
      responses:
        '200':
          $ref: '#/components/responses/PlanOK'
        '400':
          $ref: '#/components/responses/ErrorBadRequestPlain'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenScope'
        '404':
          $ref: '#/components/responses/ErrorPlanNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflictPlan'
    patch:
      tags: [admin-plans]
      operationId: updatePlan
      summary: Edit a plan's entitlements
      description: |
        The edit changes what applies to **new assignments immediately** and to **existing
        tenants at their next boundary**. It does not touch an open cycle's balance, and it does
        not move a boundary. `POST /v1/admin/plans/{id}/apply` is the route that changes that, and
        it is guarded by blast radius (DR-014).

        `entitlements` replaces the whole set, because a partial update of a bounded set is an
        ambiguity, and a plan that is an offer should be edited as one.
      security:
        - bearerAuth: []
      x-required-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanUpdate'
            examples:
              edit:
                summary: Raise the output limit
                value:
                  version: 7
                  entitlements:
                    - feature_key: llm.tokens.output
                      limit: 2000000
                      reset_interval: monthly
                    - feature_key: api.requests
                      limit: 100000
                      reset_interval: monthly
      responses:
        '200':
          $ref: '#/components/responses/PlanOK'
        '400':
          $ref: '#/components/responses/ErrorBadRequestPlain'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenScope'
        '404':
          $ref: '#/components/responses/ErrorPlanNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflictPlan'
        '413':
          $ref: '#/components/responses/ErrorPayloadTooLarge'

  /v1/admin/plans/{id}/apply:
    parameters:
      - $ref: '#/components/parameters/PlanIdPath'
    post:
      tags: [admin-plans]
      operationId: applyPlan
      summary: Re-anchor and re-limit every assigned tenant, now
      description: |
        This re-anchors every tenant assigned to the plan, so it is guarded by **blast radius**
        rather than by operator intent (DR-046).

        At or below `QUOTACORE_PLAN_APPLY_CONFIRM_THRESHOLD` (default 50) it is one call and a
        `200`. Above it, the service counts first, writes nothing, and returns
        `409 confirmation_required` carrying a single-use token. Re-issue the identical request
        with `confirmation_token` and it applies.

        The token is bound to the plan `resource_version` it was issued against, so a plan edited
        in between is refused: the count the operator approved is no longer the count. There is
        no `Idempotency-Key` on this route, deliberately. The handshake is already exactly-once
        by construction, and adding a second exactly-once mechanism to one operation is a way to
        have two opinions about whether it happened.

        To preview the numbers without provoking the error, call
        `GET /v1/admin/plans/{id}/impact` first.
      security:
        - bearerAuth: []
      x-required-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanApplyRequest'
            examples:
              first:
                summary: Below the threshold
                value:
                  reason: new contract for Northwind
              confirm:
                summary: Re-issued with the token
                value:
                  reason: new contract for Northwind
                  confirmation_token: cnf_01J8Z6M2QK9V3X7B4C0N5TDEFA
      responses:
        '200':
          $ref: '#/components/responses/PlanAppliedOK'
        '400':
          $ref: '#/components/responses/ErrorBadRequestPlain'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenScope'
        '404':
          $ref: '#/components/responses/ErrorPlanNotFound'
        '409':
          $ref: '#/components/responses/ErrorConfirmationRequired'
        '413':
          $ref: '#/components/responses/ErrorPayloadTooLarge'

  /v1/admin/plans/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/PlanIdPath'
    post:
      tags: [admin-plans]
      operationId: archivePlan
      summary: Archive a plan
      description: |
        Archiving a plan does not reassign its tenants and does not change any balance. It stops
        new assignments, and a tenant already on the plan keeps working until it is moved
        (DR-016).
      security:
        - bearerAuth: []
      x-required-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveRequest'
            examples:
              archive:
                summary: Retire a plan no longer sold
                value:
                  version: 4
                  reason: superseded by pro-2026
      responses:
        '200':
          $ref: '#/components/responses/PlanOK'
        '400':
          $ref: '#/components/responses/ErrorBadRequestPlain'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenScope'
        '404':
          $ref: '#/components/responses/ErrorPlanNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflictPlan'
        '413':
          $ref: '#/components/responses/ErrorPayloadTooLarge'

  /v1/admin/plans/{id}/impact:
    parameters:
      - $ref: '#/components/parameters/PlanIdPath'
    get:
      tags: [admin-plans]
      operationId: planImpact
      summary: Preview how many tenants an edit would affect
      description: |
        Read-only. Nothing is re-anchored, no audit row records a mutation and no token is
        issued. The route exists so that the common case is a quiet read rather than a `409`
        (UC-19).
      security:
        - bearerAuth: []
      x-required-scope: admin
      responses:
        '200':
          $ref: '#/components/responses/PlanImpactOK'
        '400':
          $ref: '#/components/responses/ErrorBadRequestPlain'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenScope'
        '404':
          $ref: '#/components/responses/ErrorPlanNotFound'

  /v1/admin/tenants:
    get:
      tags: [admin-tenants]
      operationId: listTenants
      summary: List tenants
      description: |
        Newest first, with an opaque signed cursor. Totals are not returned: a count over a large
        tenant table is a slow query pretending to be metadata.
      security:
        - bearerAuth: []
      x-required-scope: admin
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/PlanKeyQuery'
      responses:
        '200':
          $ref: '#/components/responses/TenantListOK'
        '400':
          $ref: '#/components/responses/ErrorBadRequestTimezone'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenScope'
        '409':
          $ref: '#/components/responses/ErrorConflictTenant'
    post:
      tags: [admin-tenants]
      operationId: createTenant
      summary: Provision a tenant
      description: |
        Balances are materialised here, at provisioning, and at cycle transitions. They are
        **not** materialised on first read, because a balance created on demand would hand a full
        allowance to whoever triggered it (DR-045).

        `timezone` is an IANA name such as `Europe/Berlin`. Abbreviations are rejected: a
        timezone is a set of rules, and an abbreviation is not one. The tenant's zone is what its
        cycle boundaries are computed in, so a wrong zone is a wrong bill.

        `external_id` cannot contain `@`, which makes it structurally impossible to store an
        email address as a tenant identifier (DR-034, NFR-S2).
      security:
        - bearerAuth: []
      x-required-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreate'
            examples:
              tenant:
                summary: A new customer on Pro
                value:
                  external_id: acme-prod-01
                  display_name: Acme Production
                  plan_key: pro
                  timezone: Europe/Berlin
      responses:
        '201':
          $ref: '#/components/responses/TenantCreated'
        '400':
          $ref: '#/components/responses/ErrorBadRequestTimezone'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenScope'
        '409':
          $ref: '#/components/responses/ErrorConflictTenant'
        '413':
          $ref: '#/components/responses/ErrorPayloadTooLarge'

  /v1/admin/tenants/{id}:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
    get:
      tags: [admin-tenants]
      operationId: getTenant
      summary: Read one tenant
      security:
        - bearerAuth: []
      x-required-scope: admin
      responses:
        '200':
          $ref: '#/components/responses/TenantOK'
        '400':
          $ref: '#/components/responses/ErrorBadRequestTimezone'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenScope'
        '404':
          $ref: '#/components/responses/ErrorTenantNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflictTenant'
    patch:
      tags: [admin-tenants]
      operationId: updateTenant
      summary: Change a tenant's plan, name or zone
      description: |
        **Changing `plan_key` is a hard reset.** The new plan's limits apply immediately and the
        tenant's anchor is set to the current instant, starting a fresh cycle. The previous
        balance is discarded, not prorated, and the discard is recorded as a `plan_changed` event
        so it is visible in history (DR-013).

        Proration is deferred, and it is deferred on purpose: prorating a limit is a claim about
        time that the customer did not buy. The balance was for the cycle that just ended.
      security:
        - bearerAuth: []
      x-required-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdate'
            examples:
              move:
                summary: Move to a larger plan
                value:
                  version: 12
                  plan_key: enterprise
      responses:
        '200':
          $ref: '#/components/responses/TenantOK'
        '400':
          $ref: '#/components/responses/ErrorBadRequestTimezone'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenScope'
        '404':
          $ref: '#/components/responses/ErrorTenantNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflictTenant'
        '413':
          $ref: '#/components/responses/ErrorPayloadTooLarge'
    delete:
      tags: [admin-tenants]
      operationId: deleteTenant
      summary: Soft-delete a tenant
      description: |
        A soft delete, and it is **not retroactive**. Existing usage events and audit rows stay
        queryable, which is what makes a billing dispute answerable after a churn event (T-15).

        Soft deletion is terminal: there is no undelete. A soft-deleted tenant is treated exactly
        as absent by every endpoint that takes an identifier, so `tenant_not_found` is the usual
        answer and `tenant_deleted` appears only where the caller has already been authorised to
        see that the tenant exists.
      security:
        - bearerAuth: []
      x-required-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
            examples:
              softDelete:
                summary: Customer churned
                value:
                  reason: contract ended 2026-09-30
      responses:
        '200':
          $ref: '#/components/responses/TenantOK'
        '400':
          $ref: '#/components/responses/ErrorBadRequestTimezone'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenScope'
        '404':
          $ref: '#/components/responses/ErrorTenantNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflictTenant'
        '413':
          $ref: '#/components/responses/ErrorPayloadTooLarge'

  /v1/admin/tenants/{id}/suspend:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
    post:
      tags: [admin-tenants]
      operationId: suspendTenant
      summary: Suspend a tenant
      description: |
        Consumption becomes `403 tenant_suspended`. **The balance is preserved, not zeroed**, and
        resuming restores it exactly, because a suspension is a billing decision by the operator
        and not a change in what the customer bought (DR-032).
      security:
        - bearerAuth: []
      x-required-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
            examples:
              suspend:
                summary: Payment failure
                value:
                  version: 13
                  reason: payment failed, retrying
      responses:
        '200':
          $ref: '#/components/responses/TenantOK'
        '400':
          $ref: '#/components/responses/ErrorBadRequestTimezone'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenScope'
        '404':
          $ref: '#/components/responses/ErrorTenantNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflictTenant'
        '413':
          $ref: '#/components/responses/ErrorPayloadTooLarge'

  /v1/admin/tenants/{id}/resume:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
    post:
      tags: [admin-tenants]
      operationId: resumeTenant
      summary: Resume a suspended tenant
      security:
        - bearerAuth: []
      x-required-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
            examples:
              resume:
                summary: Payment received
                value:
                  version: 14
                  reason: payment received
      responses:
        '200':
          $ref: '#/components/responses/TenantOK'
        '400':
          $ref: '#/components/responses/ErrorBadRequestTimezone'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenScope'
        '404':
          $ref: '#/components/responses/ErrorTenantNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflictTenant'
        '413':
          $ref: '#/components/responses/ErrorPayloadTooLarge'

  /v1/admin/tenants/{id}/grant:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
    post:
      tags: [admin-tenants]
      operationId: grantTenant
      summary: Add bonus quota for the current cycle
      description: |
        Raises `bonus` for the current cycle, subject to the `balance <= limit + bonus` ceiling,
        and applies immediately. A grant is **cycle-scoped**: it does not survive the boundary,
        because a bonus is a gesture and a limit is a contract (DR-019, DR-020).

        A grant on a `never` entitlement increases the balance with no ceiling tied to a cycle
        and no expiry, which is the one case where the ceiling does not apply.

        A grant that would break the ceiling is `409 grant_exceeds_ceiling`. To raise a limit
        durably, use an override, which is the correct remedy for a lasting increase.
      security:
        - bearerAuth: []
      x-required-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantRequest'
            examples:
              grant:
                summary: Goodwill for an outage
                value:
                  feature_key: llm.tokens.output
                  amount: 50000
                  reason: incident INC-2211, 30 minutes of failed responses
      responses:
        '200':
          $ref: '#/components/responses/BalanceEntryOK'
        '400':
          $ref: '#/components/responses/ErrorBadRequestPlain'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenScope'
        '404':
          $ref: '#/components/responses/ErrorNotFoundResource'
        '409':
          $ref: '#/components/responses/ErrorConflictQuota'
        '413':
          $ref: '#/components/responses/ErrorPayloadTooLarge'

  /v1/admin/tenants/{id}/set:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
    post:
      tags: [admin-tenants]
      operationId: setTenantBalance
      summary: Set a balance to an exact value
      description: |
        Overwrites the balance outright. It is the blunt instrument, and it is the right one when
        a migration produced a number that is known to be wrong.
      security:
        - bearerAuth: []
      x-required-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRequest'
            examples:
              set:
                summary: Correct a migration error
                value:
                  feature_key: llm.tokens.output
                  value: 41250
                  reason: migration backfill corrected
      responses:
        '200':
          $ref: '#/components/responses/BalanceEntryOK'
        '400':
          $ref: '#/components/responses/ErrorBadRequestPlain'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenScope'
        '404':
          $ref: '#/components/responses/ErrorNotFoundResource'
        '409':
          $ref: '#/components/responses/ErrorConflictQuota'
        '413':
          $ref: '#/components/responses/ErrorPayloadTooLarge'

  /v1/admin/tenants/{id}/force-rollover:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
    post:
      tags: [admin-tenants]
      operationId: forceRollover
      summary: Roll one feature's cycle over now
      description: |
        Applies the allowance for the next cycle immediately, for one feature. It is audited with
        a mandatory `reason`, and it is a `force_rolled_over` event in the ledger.

        A `never` entitlement cannot be rolled, because there is no cycle to roll:
        `409 reset_not_supported`. Grant explicitly instead (DR-008).
      security:
        - bearerAuth: []
      x-required-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForceRolloverRequest'
            examples:
              rollover:
                summary: Customer asked for a fresh month
                value:
                  feature_key: llm.tokens.output
                  reason: support request 88213
      responses:
        '200':
          $ref: '#/components/responses/BalanceEntryOK'
        '400':
          $ref: '#/components/responses/ErrorBadRequestPlain'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenScope'
        '404':
          $ref: '#/components/responses/ErrorNotFoundResource'
        '409':
          $ref: '#/components/responses/ErrorConflictQuota'
        '413':
          $ref: '#/components/responses/ErrorPayloadTooLarge'

  /v1/admin/tenants/{id}/overrides:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
    post:
      tags: [admin-tenants]
      operationId: upsertTenantOverride
      summary: Set or replace a per-feature override
      description: |
        An override is a **contract term** and it outranks the plan (DR-011). It survives later
        plan edits, because a plan is an offer and an override is what this one customer signed
        for.

        At least one of `limit_value` or `interval` must be present. An override that set neither
        would inherit everything from the plan and would therefore be indistinguishable from not
        existing, so it is `400 validation_failed` (UC-13).

        `apply_at` is `immediate` by default. It is a **mode, not a timestamp**: `next_boundary`
        defers the new value to the tenant's next boundary, which is the only moment a boundary
        change is meaningful.

        An override can raise a limit above the plan's. That is the mechanism for "custom limits
        for an enterprise customer". It cannot add a feature the plan does not include, which is
        `400 validation_failed` (DR-012, DR-015).

        Clearing an override is `DELETE` on the per-feature sub-path, not this route. See that
        route for why.
      security:
        - bearerAuth: []
      x-required-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverrideUpsert'
            examples:
              limit:
                summary: Ten times the plan limit, from the next boundary
                value:
                  feature_key: llm.tokens.output
                  limit_value: 10000000
                  apply_at: next_boundary
              interval:
                summary: Custom reset cadence, limit inherited from the plan
                value:
                  feature_key: api.requests
                  interval: weekly
                  apply_at: immediate
      responses:
        '200':
          $ref: '#/components/responses/OverrideOK'
        '400':
          $ref: '#/components/responses/ErrorBadRequestPlain'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenScope'
        '404':
          $ref: '#/components/responses/ErrorNotFoundResource'
        '409':
          $ref: '#/components/responses/ErrorConflictQuota'
        '413':
          $ref: '#/components/responses/ErrorPayloadTooLarge'

  /v1/admin/tenants/{id}/overrides/{feature_key}:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
      - $ref: '#/components/parameters/FeatureKeyPath'
    delete:
      tags: [admin-tenants]
      operationId: clearTenantOverride
      summary: Clear a per-feature override
      description: |
        Removes the override, so the plan value applies again (UC-13).

        `apply_at` is in the body rather than a query parameter because it changes *when* money is
        owed, and a `DELETE` that silently means "now" would be a surprise in a billing system.
        `next_boundary` restores the plan value at the tenant's next boundary; `immediate` applies
        it at once.

        This is a `DELETE` on a per-feature sub-path rather than another `POST` on the collection
        because the storage cannot represent "an override that sets nothing":
        `tenant_overrides_not_empty` rejects a row with both `limit_value` and `interval` null, so
        clearing is the **absence of the row** rather than a row of nulls. Expressing it as a
        `clear: true` field on the `POST` would mean one route with two mutually exclusive body
        modes, which is exactly the shape that generated SDKs handle worst.

        This is one of the two routes in the contract where a `DELETE` takes a body: the body
        holds `apply_at`, and the rule that a body is capped applies here like any other, so
        `413 payload_too_large` is on this route (NFR-T6).
      security:
        - bearerAuth: []
      x-required-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverrideClearRequest'
            examples:
              clear:
                summary: Restore the plan value from the next boundary
                value:
                  apply_at: next_boundary
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/ErrorBadRequestPlain'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenScope'
        '404':
          $ref: '#/components/responses/ErrorTenantNotFound'
        '413':
          $ref: '#/components/responses/ErrorPayloadTooLarge'
  
  /v1/admin/tenants/{id}/events:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
    get:
      tags: [admin-tenants]
      operationId: listUsageEvents
      summary: Read a tenant's usage ledger
      description: |
        The route that decides whether a team keeps the product, because the first time a
        customer disputes a deduction is the first time anyone evaluates it (UC-16).

        Each event shows the instant, the signed `delta`, the `balance_after`, the cycle window,
        the `source` and the `request_id`. Summing the deltas for a cycle and comparing with the
        reported balance is the reconciliation an operator performs by hand, and it is why
        `balance_after` is stored rather than recomputed (DR-042).

        For a specific disputed charge, filter by the customer's `Idempotency-Key` to see the
        recorded outcome, which is how you prove whether a call was applied once or twice.

        A known limitation, stated here because a silently incomplete history is worse than a
        documented one: events are delivered to the external sink **best effort and at-least-once**.
        Where the sink could not deliver, `system` events record the gap and the drop counter in
        `GET /v1/admin/status` is non-zero (ADR-0016).
      security:
        - bearerAuth: []
      x-required-scope: admin
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/FeatureKeyQuery'
        - $ref: '#/components/parameters/EventTypeQuery'
        - $ref: '#/components/parameters/SourceQuery'
        - $ref: '#/components/parameters/IdempotencyKeyQuery'
        - $ref: '#/components/parameters/FromQuery'
        - $ref: '#/components/parameters/ToQuery'
      responses:
        '200':
          $ref: '#/components/responses/UsageEventListOK'
        '400':
          $ref: '#/components/responses/ErrorBadRequestPlain'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenScope'
        '404':
          $ref: '#/components/responses/ErrorTenantNotFound'
        '429':
          $ref: '#/components/responses/ErrorRateLimited'
  
  /v1/admin/keys:
    get:
      tags: [admin-keys]
      operationId: listKeys
      summary: List API keys
      description: |
        Metadata only. The secret is returned exactly once, by the create route, and there is no
        route that returns it again and none ever will be added (INV-K3). A lost key is replaced,
        not recovered.

        `prefix` is the public, unique part of a key. It appears in this list and in the audit
        log so a key leaked in a support ticket can be traced to the key that leaked, which is the
        entire operational purpose of a credential identifier (DR-043, K-1).
      security:
        - bearerAuth: []
      x-required-scope: admin
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/KeyListOK'
        '400':
          $ref: '#/components/responses/ErrorBadRequestPlain'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenScope'
        '409':
          $ref: '#/components/responses/ErrorResourceVersionConflict'
    post:
      tags: [admin-keys]
      operationId: createKey
      summary: Issue an API key
      description: |
        The plaintext key is in this response and nowhere else. Only an Argon2id hash and the
        public prefix are stored, and the hash is deliberately not indexed, because indexing a
        verifier invites a timing-oracle design (ADR-0012).

        Scope is visible in the token itself, so a scope mismatch is not a 400-line debugging
        session: `qc_runtime_<prefix>.<secret>` and `qc_admin_<prefix>.<secret>`.
      security:
        - bearerAuth: []
      x-required-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyCreate'
            examples:
              key:
                summary: A runtime key for one customer's app
                value:
                  name: acme-prod-deploy
                  scope: runtime
                  expires_at: '2027-01-01T00:00:00+01:00'
      responses:
        '201':
          $ref: '#/components/responses/KeyCreated'
        '400':
          $ref: '#/components/responses/ErrorBadRequestPlain'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenScope'
        '409':
          $ref: '#/components/responses/ErrorResourceVersionConflict'
        '413':
          $ref: '#/components/responses/ErrorPayloadTooLarge'

  /v1/admin/keys/{id}:
    parameters:
      - $ref: '#/components/parameters/KeyIdPath'
    delete:
      tags: [admin-keys]
      operationId: revokeKey
      summary: Revoke an API key
      description: |
        Revocation is **immediate, with no cache delay**, because the cache stores the hash and the
        state and revocation bumps the version. A revoked key is rejected on the next request
        (UC-15, K-2).
      security:
        - bearerAuth: []
      x-required-scope: admin
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/ErrorBadRequestPlain'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenScope'
        '409':
          $ref: '#/components/responses/ErrorResourceVersionConflict'
  
  /v1/admin/audit:
    get:
      tags: [admin-observe]
      operationId: listAudit
      summary: Read the audit log
      description: |
        The contractual record, kept separately from usage history because they answer different
        questions and merging them would answer neither (UC-16). Every administrative mutation
        writes an audit row **in the same transaction as the mutation** (NFR-D4). An audit log
        written best effort is a log, not an audit trail.
      security:
        - bearerAuth: []
      x-required-scope: admin
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/TenantExternalIdQuery'
        - $ref: '#/components/parameters/FromQuery'
        - $ref: '#/components/parameters/ToQuery'
      responses:
        '200':
          $ref: '#/components/responses/AuditEntryListOK'
        '400':
          $ref: '#/components/responses/ErrorBadRequestPlain'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbiddenScope'
        '429':
          $ref: '#/components/responses/ErrorRateLimited'
  
  /v1/admin/status:
    get:
      tags: [admin-observe]
      operationId: status
      summary: Dependency health, version and queue state
      description: |
        The one call an operator makes when something is wrong, so it is **not** allowed to fail
        with an error envelope: an endpoint that returned `unauthorized` when a dependency was
        down could not report that the dependency was down, which is the one thing it exists to
        do. It reports dependency failure as data, at `200`.

        It does still require the `admin` scope (NFR-O5). Reports the build, the `tzdata` version
        the binary was built with, the current time and the snapshot size.
      security:
        - bearerAuth: []
      x-required-scope: admin
      responses:
        '200':
          $ref: '#/components/responses/StatusOK'

  /healthz:
    get:
      tags: [operational]
      operationId: healthz
      summary: Liveness probe
      description: |
        Answers `200` while the process is running. It checks no dependency, deliberately: a
        liveness probe that fails when Postgres is unreachable restarts a process that was not
        the problem.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/HealthzOK'

  /readyz:
    get:
      tags: [operational]
      operationId: readyz
      summary: Readiness probe
      description: |
        Answers `200` only when the service can actually serve: the required dependencies are
        reachable and the bootstrap key has been acknowledged (NFR-S9). This is the probe that
        gates traffic, and unlike `/healthz` it does look at dependencies.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/ReadyzOK'

  /metrics:
    get:
      tags: [operational]
      operationId: metrics
      summary: Prometheus metrics
      description: |
        Prometheus text exposition format, not JSON and not an error envelope.

        `quotacore_errors_total` is labelled by `code`, and the label set is
        [error-catalog.md](../../docs/product/error-catalog.md) by reference: a contract test
        asserts the two match, so a code cannot be raised in the service without being in the
        catalogue.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/MetricsOK'

  /openapi.json:
    get:
      tags: [operational]
      operationId: openapiDocument
      summary: This document, as served by the running service
      description: |
        The contract the running binary was built from, rendered as JSON.

        The source of truth is `api/openapi.yaml`, which is embedded in the binary at build time,
        so a contract cannot drift from the binary in a way nothing would notice (ADR-0010, DoD
        item 5). The bytes served are a JSON rendering of that embedded document rather than the
        YAML text: `application/json` is what a client and a tool expect here, and a YAML body
        labelled as JSON is the kind of small lie that costs someone an afternoon. A test asserts
        that the served document is a faithful, order-preserving conversion of the embedded YAML,
        so the rendering cannot quietly drop or reorder anything either.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/OpenAPIOK'

  /docs:
    get:
      tags: [operational]
      operationId: docs
      summary: Generated HTML API reference
      description: |
        A single self-contained HTML page generated from this document at build time, with no
        third-party JavaScript and no call to a CDN. It works on a host with no egress, which is
        the same constraint as everything else in this product.

        The page is generated by `make docs` and CI fails if the committed page differs from the
        generated one, so it cannot rot silently.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/DocsOK'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Quotacore API key
      description: |
        An API key as `Authorization: Bearer <key>`.

        A key is either `qc_runtime_<prefix>.<secret>` or `qc_admin_<prefix>.<secret>`. The scope
        is visible in the token itself, so a scope mismatch is not a debugging session: a
        `runtime` key on `/v1/admin/*` is `403 insufficient_scope`, and an `admin` key works on
        both planes.

        An HTTP bearer scheme has no scopes, so the scope array in every requirement above is
        empty, as OpenAPI requires. The scope a route needs is recorded instead in
        `x-required-scope`, which is `runtime` on the four data-plane routes, `admin` on
        `/v1/admin/*`, and absent on the operational routes that take no credential at all. The
        rule itself is stated once, in
        [api-conventions.md](../../docs/architecture/api-conventions.md) (DR-043, NFR-O5).

        Possession of a runtime key gives access to **every** tenant on the instance. A key is a
        credential for the whole instance, and `external_id` in the request selects the tenant.
        This is a single-tenant-per-instance product (ADR-0013), and the key issuance is an
        audited, per-customer decision for that reason.

        There is no recovery path. A key that leaks is rotated, not recovered.

  headers:
    XRequestId:
      description: |
        Identifies this request, and is the join key across logs, events and a customer report
        (NFR-S10). Adopted from the inbound request when it is a valid ULID or UUID, otherwise
        minted. Present on **every** response, including the error responses and the probes.
      required: true
      schema:
        $ref: '#/components/schemas/RequestId'
    IdempotentReplay:
      description: |
        `true` when this response is a replay of a stored one rather than a new application. A
        proxy or a client can tell without parsing the body. The body is byte-identical to the
        original either way, so `replayed` in the body says the same thing (DR-026).
      required: false
      schema:
        type: boolean
    RetryAfter:
      description: |
        Seconds to wait. Present on `429 rate_limited`, which is the service protecting itself and
        is deliberately distinguishable from `429 quota_exceeded` (DR-040). It is **not** present
        on `quota_exceeded`: that one is retryable at `cycle_end`, which is in `details`, and a
        `Retry-After` of a few seconds would invite a hammering loop.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        One key per **logical operation**, reused across every attempt including retries. Derive
        it from your own durable operation identifier where one exists.

        A repeat with a matching fingerprint replays the stored response. A repeat with a
        different fingerprint is `409 idempotency_key_reuse` and changes nothing. The window is 24
        hours from application, per tenant, and is not configurable.

        **The one case no server can protect against:** a retry with a *new* key is a second
        operation and is charged twice. No scheme detects that (FS-03).
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
      examples:
        ulid:
          summary: A 26-character ULID
          value: 01JCQ9W3K2M9XQ3F8V6T0B5NDE
    IdempotencyKeyQuery:
      name: idempotency_key
      in: query
      required: false
      description: |
        Filter the ledger to one logical operation, by the key the customer sent. This is how a
        disputed charge is resolved: the recorded outcome shows whether it was applied once or
        twice (UC-16).
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
    TenantExternalIdQuery:
      name: tenant_external_id
      in: query
      required: false
      description: Your identifier for the tenant. The customer never handles an internal `tenant_id`.
      schema:
        $ref: '#/components/schemas/ExternalId'
    FeatureKeyQuery:
      name: feature_key
      in: query
      required: false
      description: |
        Restrict to one feature. On `GET /v1/balance` it is optional, and omitting it returns the
        tenant's full set, which is bounded by the plan's entitlement count (NFR-T5).
      schema:
        $ref: '#/components/schemas/FeatureKey'
    PlanKeyQuery:
      name: plan_key
      in: query
      required: false
      description: Restrict the tenant list to one plan.
      schema:
        $ref: '#/components/schemas/PlanKey'
    FeatureKeyPath:
      name: feature_key
      in: path
      required: true
      description: The feature key, as in the catalogue.
      schema:
        $ref: '#/components/schemas/FeatureKey'
      examples:
        dotted:
          summary: A dotted feature key
          value: llm.tokens.output
    PlanIdPath:
      name: id
      in: path
      required: true
      description: A plan identifier. Either the UUID or the plan key; both address a plan.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    TenantIdPath:
      name: id
      in: path
      required: true
      description: A tenant identifier. Either the UUID or the `external_id`; both address a tenant.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    KeyIdPath:
      name: id
      in: path
      required: true
      description: A key identifier (the UUID, not the secret).
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque and signed. A tampered cursor is `400 validation_failed`, never a silent full
        scan. Newest first, always, with a stable tiebreaker so a cursor is never ambiguous.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. An empty page returns an empty array, never `null`.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50
    FromQuery:
      name: from
      in: query
      required: false
      description: Start of the time range, RFC 3339 with an explicit offset. Same format as responses.
      schema:
        $ref: '#/components/schemas/Timestamp'
    ToQuery:
      name: to
      in: query
      required: false
      description: End of the time range, RFC 3339 with an explicit offset.
      schema:
        $ref: '#/components/schemas/Timestamp'
    EventTypeQuery:
      name: event_type
      in: query
      required: false
      description: |
        One of the seven ledger event types. Any other value is `400 validation_failed`, never an
        empty result: a filter that silently matches nothing is worse than one that says no.
      schema:
        $ref: '#/components/schemas/EventType'
    SourceQuery:
      name: source
      in: query
      required: false
      description: Who caused the event. Any other value is `400 validation_failed`.
      schema:
        $ref: '#/components/schemas/EventSource'

  examples:
    ValidationFailed:
      summary: One entry per offending field, in one response
      description: |
        Aggregated on purpose. Three bad fields produce one `validation_failed` naming all three,
        not three responses, because a client fixing a request should not have to make three
        round trips to learn three things.
      value:
        error:
          code: validation_failed
          message: 2 fields are invalid
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
          details:
            errors:
              - field: amount
                issue: must be an integer, got 4200.0
              - field: metadata
                issue: must be at most 4096 bytes
    InvalidAmount:
      summary: A negative amount
      description: |
        The direction is the endpoint, never a sign. Use `POST /v1/refund`, not a negative
        `consume` (DR-023, ADR-0005).
      value:
        error:
          code: invalid_amount
          message: 'amount: must not be negative'
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
          details:
            field: amount
            min: 0
    InvalidWindow:
      summary: A window that disagrees with the cadence
      description: |
        Either the window is not valid for the feature's cadence, or it is a v0.2 feature called
        on a v0.1 build. The two cadences are never silently mixed, because a silent mix makes
        the balance a lie.
      value:
        error:
          code: invalid_window
          message: 'window: rolling_1h is not available in v0.1'
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
          details:
            field: window
            requested: rolling_1h
            supported: anchored
    InvalidTimezone:
      summary: An abbreviation where an IANA name is required
      description: |
        A timezone is a set of historical and future rules. `CET` is not that. Rejecting
        abbreviations is what stops a boundary being computed from the wrong rules forever.
      value:
        error:
          code: invalid_timezone
          message: "timezone: 'CET' is not an IANA time zone name"
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
          details:
            field: timezone
            value: CET
    MissingIdempotencyKey:
      summary: No Idempotency-Key on a route that requires one
      description: |
        There is no server-generated fallback. A generated key silently defeats the purpose of
        the header, which is to make one logical operation one charge (DR-026).
      value:
        error:
          code: missing_idempotency_key
          message: the Idempotency-Key header is required on this route
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
    Unauthorized:
      summary: No credential presented
      value:
        error:
          code: unauthorized
          message: no API key presented
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
    ApiKeyInvalid:
      summary: A key that is unknown, revoked, expired or malformed
      description: |
        There is no recovery path. Rotate the key; the old one cannot be made to work again.
      value:
        error:
          code: api_key_invalid
          message: the presented API key is not valid
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
    InsufficientScope:
      summary: A valid key with the wrong scope
      description: |
        `403`, not `404`. Hiding the endpoint from an authenticated caller helps nobody, and a
        `runtime` key discovering it exists is not a disclosure worth preventing (FS-18).
      value:
        error:
          code: insufficient_scope
          message: this key does not carry the admin scope
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
          details:
            required: admin
            presented: runtime
    FeatureNotInPlan:
      summary: No entitlement for the feature
      description: |
        A limit of `0` and an absent entitlement are different states, and the difference has to
        be visible: "you get none of this because you are on Free" and "your Free plan includes
        zero of this" are different product messages (DR-012).

        An unknown feature key on the data plane produces this same code, so feature existence is
        not leaked (FS-17).
      value:
        error:
          code: feature_not_in_plan
          message: 'feature llm.tokens.output is not in the tenant''s plan'
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
          details:
            feature_key: llm.tokens.output
    FeatureArchived:
      summary: The feature exists but is archived
      description: |
        Balances are preserved, not zeroed. Archiving a feature does not take money the customer
        has already bought (DR-016).
      value:
        error:
          code: feature_archived
          message: 'feature llm.tokens.output is archived and no longer accepts consumption'
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
          details:
            feature_key: llm.tokens.output
            archived_at: '2026-08-01T00:00:00+02:00'
    TenantSuspended:
      summary: The tenant is suspended
      description: |
        The balance is preserved and resuming restores it exactly. A suspension is a billing
        decision, not a change in what the customer bought (DR-032).
      value:
        error:
          code: tenant_suspended
          message: tenant acme-prod-01 is suspended
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
          details:
            tenant_external_id: acme-prod-01
    TenantNotFound:
      summary: Unknown or soft-deleted tenant
      description: |
        A soft-deleted tenant is treated exactly as absent, so this is also the answer after a
        soft delete. A recently provisioned tenant may not be visible yet (DR-031).
      value:
        error:
          code: tenant_not_found
          message: no such tenant
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
          details:
            tenant_external_id: acme-prod-01
    FeatureNotFound:
      summary: Unknown feature key on the admin API
      value:
        error:
          code: feature_not_found
          message: 'no such feature: llm.tokens.vision'
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
          details:
            feature_key: llm.tokens.vision
    PlanNotFound:
      summary: Unknown plan on the admin API
      value:
        error:
          code: plan_not_found
          message: 'no such plan: enterprise-legacy'
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
          details:
            plan_key: enterprise-legacy
    PayloadTooLarge:
      summary: metadata above its cap
      description: |
        The body is capped before it is parsed, so this is decided without reading the payload
        (NFR-T6). `metadata` is correlation, not a data store.
      value:
        error:
          code: payload_too_large
          message: 'metadata exceeds the 4096 byte limit'
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
          details:
            field: metadata
            limit_bytes: 4096
    IdempotencyKeyReuse:
      summary: The same key, a different operation
      description: |
        The fingerprint is a hash of `operation | tenant | feature | amount`. A mismatch is
        refused and **no state changes**; the original record is preserved (DR-028, INV-I2).
      value:
        error:
          code: idempotency_key_reuse
          message: this Idempotency-Key was first used for a different operation
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
          details:
            idempotency_key: 01JCQ9W3K2M9XQ3F8V6T0B5NDE
            first_seen: '2026-09-27T10:11:12+02:00'
    PlanInUse:
      summary: Delete attempted on a referenced plan
      description: Archive it instead. The reference is enforced in the database too, by
        `ON DELETE RESTRICT` (DR-016).
      value:
        error:
          code: plan_in_use
          message: plan pro is assigned to 1840 tenants
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
          details:
            plan_key: pro
            referencing_tenants: 1840
    FeatureInUse:
      summary: Delete attempted on a referenced feature
      value:
        error:
          code: feature_in_use
          message: feature llm.tokens.output is referenced by 3 plans
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
          details:
            feature_key: llm.tokens.output
            referencing_plans: 3
    FeatureKeyExists:
      summary: A duplicate feature key
      value:
        error:
          code: feature_key_exists
          message: 'feature key llm.tokens.output already exists'
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
          details:
            feature_key: llm.tokens.output
    TenantExists:
      summary: A duplicate external_id
      description: |
        Deliberately **not** idempotent, so the data error surfaces. Returning the existing tenant
        as if it had been created would hide a provisioning bug.
      value:
        error:
          code: tenant_exists
          message: 'tenant external_id acme-prod-01 already exists'
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
          details:
            external_id: acme-prod-01
    TenantDeleted:
      summary: An operation on a soft-deleted tenant
      description: |
        Soft deletion is terminal. Create a new tenant, or restore from a backup. This code
        appears only where the caller is already authorised to know the tenant exists; elsewhere
        the answer is `tenant_not_found`.
      value:
        error:
          code: tenant_deleted
          message: 'tenant acme-prod-01 was deleted on 2026-09-30 and cannot be modified'
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
          details:
            external_id: acme-prod-01
            deleted_at: '2026-09-30T00:00:00+02:00'
    PlanKeyExists:
      summary: A duplicate plan key
      value:
        error:
          code: plan_key_exists
          message: 'plan key pro already exists'
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
          details:
            plan_key: pro
    RefundExceedsGrant:
      summary: A refund that would break the ceiling
      description: |
        A refund may not take `balance` above `limit + bonus`. A refund never returns
        `quota_exceeded`: the bound a refund can break is this one (DR-019). If the intent is a
        permanent increase, use an admin `grant`.
      value:
        error:
          code: refund_exceeds_grant
          message: refund of 90000 would take the balance above limit plus bonus
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
          details:
            feature_key: llm.tokens.output
            balance: 41250
            limit: 1000000
            bonus: 0
    GrantExceedsCeiling:
      summary: A grant that would break the ceiling
      description: |
        Raise the limit with an override first. A grant is cycle-scoped and a limit is a contract,
        and a lasting increase is a limit change (DR-019, DR-020).
      value:
        error:
          code: grant_exceeds_ceiling
          message: grant of 960000 would take the balance above limit plus bonus
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
          details:
            feature_key: llm.tokens.output
            balance: 41250
            limit: 1000000
            bonus: 0
            ceiling: 1000000
    ResetNotSupported:
      summary: A rollover on a `never` entitlement
      description: |
        There is no cycle to roll. `never` is a lifetime allowance with no boundary and no
        expiry, so a rollover request against it is a category error, not a missing feature
        (DR-008). Grant explicitly.
      value:
        error:
          code: reset_not_supported
          message: 'feature api.requests has interval never, which has no cycle to roll over'
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
          details:
            feature_key: api.requests
            interval: never
    FeatureUnitImmutable:
      summary: A unit change on an assigned feature
      description: |
        Reinterpreting historical amounts is not allowed, so a unit that has been used to
        account for anything can never change. Create a new feature (INV-F2).
      value:
        error:
          code: feature_unit_immutable
          message: 'unit of feature llm.tokens.output cannot change from token to request'
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
          details:
            feature_key: llm.tokens.output
            current: token
            requested: request
    ResourceVersionConflict:
      summary: A stale version on a control-plane mutation
      description: |
        Retryable **after a re-read**, not by retrying the same body. The current version is in
        `details` so a client can re-read and retry deliberately (FS-12).
      value:
        error:
          code: resource_version_conflict
          message: the resource was modified by someone else
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
          details:
            expected_version: 7
            current_version: 9
    ConfirmationRequired:
      summary: apply-now above the threshold, and nothing was applied
      description: |
        The service counted first, wrote nothing, and issued a single-use token bound to the plan
        `resource_version` it was counted against (DR-046). Re-issue the identical request with
        `confirmation_token`.

        Retryable by re-issuing **with** the token. A retried confirmation cannot re-apply an
        operation that already applied.
      value:
        error:
          code: confirmation_required
          message: this edit would affect 1840 tenants
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
          details:
            affected_tenants: 1840
            earliest_cycle_end: '2026-10-01T00:00:00+02:00'
            confirmation_token: cnf_01J8Z6M2QK9V3X7B4C0N5TDEFA
            threshold: 50
            expires_in_s: 900
            plan_version: 7
    QuotaExceeded:
      summary: Not enough in this cycle
      description: |
        Retryable at `cycle_end`, which is in `details` and is authoritative. This is **not** the
        service rate-limiting you: there is no `Retry-After` on this code, on purpose, because a
        few seconds is not what fixes it and the header would invite a hammering loop (DR-040).
      value:
        error:
          code: quota_exceeded
          message: 'balance 50 is below the requested amount 100'
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
          details:
            feature_key: llm.tokens.output
            balance: 50
            requested: 100
            limit: 1000
            cycle_end: '2026-10-01T00:00:00+02:00'
    RateLimited:
      summary: The service protecting itself
      description: |
        Deliberately distinguishable from `quota_exceeded` by code, because the remedy is
        completely different: back off, rather than wait for a reset (DR-040).
      value:
        error:
          code: rate_limited
          message: too many requests for this key
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
          retry_after_ms: 250
          details:
            limit_per_second: 2000
    InternalError:
      summary: A defect, and nothing was applied
      description: |
        A `500` on `consume` or `refund` **always** means the balance is unchanged, because the
        mutation is one atomic script execution. A client-side retry after a `500` is safe.

        Quote the `request_id`.
      value:
        error:
          code: internal_error
          message: an unexpected error occurred
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
    ServiceUnavailable:
      summary: A data-store problem, or the atomic script could not be evaluated
      description: |
        Retryable with backoff and jitter. Whether to fail **open** or **closed** is a
        deliberate decision in your application, not one this service makes for you (DR-037).

        Note that `consume` is not safe to retry blindly here unless you also send the same
        `Idempotency-Key`; a new key on retry is a second charge (FS-03).
      value:
        error:
          code: service_unavailable
          message: the data store is unavailable
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
          retry_after_ms: 100
    ControlPlaneUnavailable:
      summary: Postgres is unreachable and this tenant is not in the snapshot
      description: |
        Distinct from `service_unavailable` on purpose. Tenants already in the snapshot are
        unaffected, which is the whole reason the snapshot exists, and a code that conflated the
        two would make an incident impossible to diagnose (DR-036).
      value:
        error:
          code: control_plane_unavailable
          message: tenant configuration is not available in the snapshot
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
          retry_after_ms: 100
          details:
            tenant_external_id: acme-prod-01
    NotImplemented:
      summary: A later-release surface called on an MVP build
      description: |
        The remedy is to upgrade, or to use the MVP equivalent. This is not a transient failure
        and retrying does not help.
      value:
        error:
          code: not_implemented
          message: this endpoint is not available in v0.1
          request_id: 01J8Z6M2QK9V3X7B4C0N5TDEFA
          details:
            available_in: v0.2

  responses:

    NoContent:
      x-status: 204
      description: |
        Done, and there is nothing to return. `X-Request-Id` is still on the response: NFR-S10 says
        every response carries it, and a `204` is a response.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'

    MeteredOK:
      x-status: 200
      description: |
        The deduction was applied, or the stored response was replayed. `balance` is **after** the
        deduction, `consumed` is the amount the *original* call applied, and the two together
        reconstruct the balance before it.

        `consumed` is returned unchanged on a replay, because the replayed response is
        byte-identical to the original (DR-026). To tell whether this particular call moved
        anything, read `replayed` or the `Idempotent-Replay` header; it is a one-field test rather
        than an inference from arithmetic.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Idempotent-Replay:
          $ref: '#/components/headers/IdempotentReplay'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MeteredResponse'
          examples:
            applied:
              summary: A first application
              value:
                tenant_external_id: acme-prod-01
                feature_key: llm.tokens.output
                balance: 41250
                limit: 1000000
                bonus: 0
                consumed: 4200
                cycle_start: '2026-09-01T00:00:00+02:00'
                cycle_end: '2026-10-01T00:00:00+02:00'
                replayed: false
            replayed:
              summary: 'The same key replayed, with the identical body and replayed: true'
              value:
                tenant_external_id: acme-prod-01
                feature_key: llm.tokens.output
                balance: 41250
                limit: 1000000
                bonus: 0
                consumed: 4200
                cycle_start: '2026-09-01T00:00:00+02:00'
                cycle_end: '2026-10-01T00:00:00+02:00'
                replayed: true

