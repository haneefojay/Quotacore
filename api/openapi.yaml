        A refusal that is about the caller or the entitlement, not the request's shape. Nothing
        was charged.

        All four are `403` and they are told apart by `code`, never by status: this is the case
        the catalogue's "no code carries meaning in its HTTP status" rule exists for.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            insufficient_scope:
              $ref: '#/components/examples/InsufficientScope'
            feature_not_in_plan:
              $ref: '#/components/examples/FeatureNotInPlan'
            feature_archived:
              $ref: '#/components/examples/FeatureArchived'
            tenant_suspended:
              $ref: '#/components/examples/TenantSuspended'

    ErrorForbiddenScope:
      x-status: 403
      x-codes: [insufficient_scope]
      description: |
        A valid key with the wrong scope. `403` and not `404`, because the caller is already
        authenticated and hiding the endpoint helps nobody (FS-18).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            insufficient_scope:
              $ref: '#/components/examples/InsufficientScope'

    ErrorFeatureNotFound:
      x-status: 404
      x-codes: [feature_not_found]
      description: No such feature key on the admin API.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            feature_not_found:
              $ref: '#/components/examples/FeatureNotFound'

    ErrorPlanNotFound:
      x-status: 404
      x-codes: [plan_not_found]
      description: No such plan.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            plan_not_found:
              $ref: '#/components/examples/PlanNotFound'

    ErrorTenantNotFound:
      x-status: 404
      x-codes: [tenant_not_found]
      description: |
        Unknown or soft-deleted tenant. A soft-deleted tenant is treated exactly as absent, which
        is why this is also the answer after a soft delete (T-15).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            tenant_not_found:
              $ref: '#/components/examples/TenantNotFound'

    ErrorNotFoundResource:
      x-status: 404
      x-codes: [feature_not_found, tenant_not_found]
      description: |
        Neither the tenant nor the named feature exists. On the admin API existence is not
        hidden, because the operator is already authorised for the whole instance.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            feature_not_found:
              $ref: '#/components/examples/FeatureNotFound'
            tenant_not_found:
              $ref: '#/components/examples/TenantNotFound'

    ErrorIdempotencyKeyReuse:
      x-status: 409
      x-codes: [idempotency_key_reuse]
      description: |
        The key was first used for a different operation. No state changed and the original record
        is preserved (DR-028, INV-I2). Retry with a **new** key only if the new operation is
        genuinely a new one.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            idempotency_key_reuse:
              $ref: '#/components/examples/IdempotencyKeyReuse'

    ErrorRefundConflict:
      x-status: 409
      x-codes: [idempotency_key_reuse, refund_exceeds_grant]
      description: |
        A refund conflict. It never returns `quota_exceeded`: a refund cannot exceed a balance,
        and the bound it can break is `balance <= limit + bonus` (DR-019).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            idempotency_key_reuse:
              $ref: '#/components/examples/IdempotencyKeyReuse'
            refund_exceeds_grant:
              $ref: '#/components/examples/RefundExceedsGrant'

    ErrorConflictFeature:
      x-status: 409
      x-codes: [feature_key_exists, feature_in_use, feature_unit_immutable, resource_version_conflict]
      description: |
        A feature conflict, and nothing changed. `feature_unit_immutable` and
        `resource_version_conflict` are the two ways a feature mutation is refused; the other two
        are duplicate-key and still-referenced.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            feature_key_exists:
              $ref: '#/components/examples/FeatureKeyExists'
            feature_in_use:
              $ref: '#/components/examples/FeatureInUse'
            feature_unit_immutable:
              $ref: '#/components/examples/FeatureUnitImmutable'
            resource_version_conflict:
              $ref: '#/components/examples/ResourceVersionConflict'

    ErrorConflictPlan:
      x-status: 409
      x-codes: [plan_key_exists, plan_in_use, resource_version_conflict, confirmation_required]
      description: |
        A plan conflict, and **nothing changed**. `confirmation_required` is the same status
        because it also applied nothing: it is a refusal that hands back a token, not a partial
        application (DR-046).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            plan_key_exists:
              $ref: '#/components/examples/PlanKeyExists'
            plan_in_use:
              $ref: '#/components/examples/PlanInUse'
            resource_version_conflict:
              $ref: '#/components/examples/ResourceVersionConflict'
            confirmation_required:
              $ref: '#/components/examples/ConfirmationRequired'

    ErrorConfirmationRequired:
      x-status: 409
      x-codes: [confirmation_required]
      description: |
        The edit would affect more tenants than
        `QUOTACORE_PLAN_APPLY_CONFIRM_THRESHOLD` (default 50), so it applied **nothing** and
        returned a single-use token instead.

        Re-issue the identical request with `confirmation_token`. The token is bound to the plan
        `resource_version` it was issued against, so a plan edited in between is refused.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            confirmation_required:
              $ref: '#/components/examples/ConfirmationRequired'

    ErrorConflictTenant:
      x-status: 409
      x-codes: [tenant_exists, tenant_deleted, resource_version_conflict]
      description: |
        A tenant conflict, and nothing changed. `tenant_exists` is deliberately not idempotent, so
        a provisioning bug surfaces instead of being hidden.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            tenant_exists:
              $ref: '#/components/examples/TenantExists'
            tenant_deleted:
              $ref: '#/components/examples/TenantDeleted'
            resource_version_conflict:
              $ref: '#/components/examples/ResourceVersionConflict'

    ErrorConflictQuota:
      x-status: 409
      x-codes: [grant_exceeds_ceiling, reset_not_supported, resource_version_conflict]
      description: |
        A refused administrative change to a balance. Nothing was applied in any of the three
        cases.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            grant_exceeds_ceiling:
              $ref: '#/components/examples/GrantExceedsCeiling'
            reset_not_supported:
              $ref: '#/components/examples/ResetNotSupported'
            resource_version_conflict:
              $ref: '#/components/examples/ResourceVersionConflict'

    ErrorResourceVersionConflict:
      x-status: 409
      x-codes: [resource_version_conflict]
      description: |
        Optimistic concurrency. Re-read the resource and retry with the current `version`; retrying
        the same body will fail the same way.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            resource_version_conflict:
              $ref: '#/components/examples/ResourceVersionConflict'

    ErrorPayloadTooLarge:
      x-status: 413
      x-codes: [payload_too_large]
      description: |
        The body was refused **before it was parsed** (NFR-T6). Absent from every read route, and
        from `DELETE .../overrides/{feature_key}`, which takes no body.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            payload_too_large:
              $ref: '#/components/examples/PayloadTooLarge'

    ErrorQuotaAndRate:
      x-status: 429
      x-codes: [quota_exceeded, rate_limited]
      description: |
        Two entirely different problems that share a status, which is why the catalogue says no
        code may carry meaning in its status alone (DR-040).

        `quota_exceeded` is the tenant's money for this cycle and is retryable at
        `details.cycle_end`, with no `Retry-After`. `rate_limited` is this service protecting
        itself and is retryable in seconds, with a `Retry-After`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            quota_exceeded:
              $ref: '#/components/examples/QuotaExceeded'
            rate_limited:
              $ref: '#/components/examples/RateLimited'

    ErrorRateLimited:
      x-status: 429
      x-codes: [rate_limited]
      description: |
        This service is rate-limiting the key. Distinct from `quota_exceeded`, which is the
        tenant's allowance rather than the service's protection (DR-040).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            rate_limited:
              $ref: '#/components/examples/RateLimited'

    ErrorInternal:
      x-status: 500
      x-codes: [internal_error]
      description: |
        A defect, and **nothing was applied**. On `consume` or `refund` a `500` always means the
        balance is unchanged, because the mutation is a single atomic script execution, so a
        client-side retry is safe.

        Quote the `request_id`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internal_error:
              $ref: '#/components/examples/InternalError'

    ErrorNotImplemented:
      x-status: 501
      x-codes: [not_implemented]
      description: |
        A later-release surface called on an MVP build. Not transient: retrying does not help.
        Upgrade, or use the MVP equivalent.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            not_implemented:
              $ref: '#/components/examples/NotImplemented'

    ErrorUnavailable:
      x-status: 503
      x-codes: [service_unavailable, control_plane_unavailable]
      description: |
        A dependency is unavailable. Both are retryable with backoff and jitter, and whether to
        fail **open** or **closed** is a decision your application makes deliberately
        (DR-037).

        The two codes are separate because cached tenants are unaffected when Postgres is
        unreachable, and conflating them would make an incident impossible to diagnose
        (DR-036).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            service_unavailable:
              $ref: '#/components/examples/ServiceUnavailable'
            control_plane_unavailable:
              $ref: '#/components/examples/ControlPlaneUnavailable'

  schemas:

    RequestId:
      type: string
      description: |
        A ULID or a UUID. Adopted from the inbound `X-Request-Id` when it is one of those,
        otherwise minted. It is the join key across logs, ledger events and a customer's bug
        report (NFR-S10).
      pattern: '^(?:[0-9A-HJKMNP-TV-Z]{26}|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'
      examples:
        ulid:
          summary: A ULID
          value: 01J8Z6M2QK9V3X7B4C0N5TDEFA

    IdempotencyKey:
      type: string
      description: |
        One key per logical operation, reused across every attempt including retries. The window
        is 24 hours from application and is **not** configurable, because it is a documented
        customer guarantee (DR-029).
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      examples:
        ulid:
          value: 01JCQ9W3K2M9XQ3F8V6T0B5NDE

    Timestamp:
      type: string
      description: |
        RFC 3339 with an **explicit offset**, always, including `Z`. The offset is present even
        when it is `Z` unless `Z` is the whole value, so no client branches on whether a zone is
        UTC.

        The difference this prevents is not academic: the gap between a UTC assumption and
        `Europe/Berlin` across a DST change is 31 days minus one hour, and a customer notices.
      format: date-time
      examples:
        offset:
          summary: An explicit offset
          value: '2026-10-01T00:00:00+02:00'
        utc:
          summary: The same instant in UTC
          value: '2026-09-30T22:00:00Z'

    ExternalId:
      type: string
      description: |
        Your identifier for a tenant, as in `tenant_external_id`.

        The character class **excludes `@`**, which makes it structurally impossible to store an
        email address as a tenant identifier. That is a schema-level guarantee about the absence
        of PII rather than a convention (DR-034, NFR-S2).
      pattern: '^[A-Za-z0-9._:-]{1,128}$'
      examples:
        tenant:
          value: acme-prod-01

    FeatureKey:
      type: string
      description: |
        A metered feature's key, matching the `features_key_format` constraint. The key is
        immutable once created (INV-F3).
      pattern: '^[a-z0-9](?:[a-z0-9._-]{0,62}[a-z0-9])?$'
      examples:
        dotted:
          value: llm.tokens.output

    PlanKey:
      type: string
      description: A plan key, matching the `plans_key_format` constraint.
      pattern: '^[a-z0-9][a-z0-9_-]{0,62}$'
      examples:
        plan:
          value: pro

    Unit:
      type: string
      description: |
        What one `amount` counts: `token`, `request`, `image`, and so on. The unit is documented on
        the feature and is **never inferred**, which is why it is immutable once the feature is
        used for anything (INV-F2).
      pattern: '^[a-z][a-z0-9_]{0,31}$'
      examples:
        unit:
          value: token

    Amount:
      type: integer
      description: |
        A count of the feature's unit. JSON **integers only**: `4200.0` is
        `400 validation_failed` naming the field, because accepting a float and rounding it
        silently is how a customer loses money without noticing (DR-022).

        The maximum is `2^53 - 1`, not `2^63 - 1`, and that is a scripting-language limit rather
        than a storage one: the atomic script's numbers are doubles, so a balance above `2^53 - 1`
        cannot be represented exactly by the code that enforces the ceiling. The database, the API
        and the script all reject the same values, so a metering system that silently rounds is
        avoided in favour of one that refuses the value.
      format: int64
      minimum: 0
      maximum: 9007199254740991

    Limit:
      type: integer
      description: A cycle allowance. Same integer rules and same `2^53 - 1` ceiling as `Amount`.
      format: int64
      minimum: 0
      maximum: 9007199254740991
      examples:
        monthly:
          value: 1000000

    Version:
      type: integer
      description: |
        Optimistic-concurrency token. Read it, send it back, and on a mismatch re-read before
        retrying. Last-write-wins on a resource that governs a customer's money is not acceptable
        (FS-12).
      format: int64
      minimum: 1
      examples:
        current:
          value: 7

    ResetInterval:
      type: string
      description: |
        The cadence of an entitlement. A `never` entitlement is a lifetime allowance: no boundary,
        no expiry, no rollover, and `cycle_start` and `cycle_end` are `null` (DR-008, INV-C6).
      enum: [hourly, daily, weekly, monthly, yearly, never]

    OverrideApplyAt:
      type: string
      description: |
        A **mode, not a timestamp**. `immediate` applies now; `next_boundary` applies at the
        tenant's next boundary, which is the only moment a boundary change is meaningful.

        It is a mode because the actual instant an override takes effect is always the tenant's
        next boundary, computed by the cycle engine and never stored. The name is a deliberate
        wart kept for the API's benefit, and it is why the enum type exists in the schema: a
        `timestamptz DEFAULT 'immediate'` would not be a slightly awkward value, it would not
        parse.
      enum: [immediate, next_boundary]
      default: immediate

    KeyScope:
      type: string
      description: |
        `runtime` for `/v1/*`, `admin` for `/v1/admin/*`. An `admin` key also works on the data
        plane.
      enum: [runtime, admin]

    KeyState:
      type: string
      description: A key's lifecycle. Revocation is effective on the next request, with no cache delay.
      enum: [active, revoked, expired]

    TenantState:
      type: string
      description: |
        `suspended` preserves the balance exactly; resuming restores it (DR-032). `deleted` is a
        soft delete and is terminal.
      enum: [active, suspended, deleted]

    ArchiveState:
      type: string
      description: |
        A resource is archived rather than deleted, so audit and event history never dangles
        (DR-016).
      enum: [active, archived]

    FeatureKind:
      type: string
      description: |
        `metered` in v0.1. `boolean` exists in the schema with no v0.1 use, because adding an enum
        value later is a schema change and v0.2's design is already known.
      enum: [metered, boolean]

    EventSource:
      type: string
      description: Who caused the event.
      enum: [api, admin, system]

    EventType:
      type: string
      description: |
        The seven ledger event types. `delta` is signed and never zero, so an `amount: 0` consume
        records no event at all (DR-023).
      enum: [consumed, refunded, granted, set, plan_changed, cycle_rolled_over, force_rolled_over]

    # There is deliberately no shared `CycleWindow` schema, and the repetition of
    # `cycle_start`/`cycle_end` across MeteredResponse, CheckResponse, BalanceEntry and
    # UsageEvent is deliberate.
    #
    # The obvious "fix" is to factor the pair into one schema and reference it with `allOf`.
    # That silently breaks request/response strictness: in JSON Schema 2020-12 a subschema's
    # `additionalProperties: false` only sees the `properties` declared in *that* subschema,
    # so the shared window would reject every sibling field (MeteredResponse would fail its own
    # `balance`). The correct refactor needs `unevaluatedProperties: false` at the outer level
    # or a `discriminator`-style merge, both of which would put DoD item 3 at the mercy of
    # ogen support that has not been verified.
    #
    # Four inline copies of a nullable timestamp pair is a smaller cost than a generated
    # validator that stops rejecting undeclared fields. The invariant that `cycle_start` is null
    # exactly when `cycle_end` is null, being a `never` entitlement, lives once in
    # domain-rules.md (DR-002, DR-003) rather than being restated per schema.

    Metadata:
      type: object
      description: |
        Correlation only: at most 4 KiB, never indexed, never logged, and **never returned by any
        endpoint** (DR-043, NFR-T6). It is not a data store and it is not a place for PII.
      additionalProperties: true
      examples:
        correlation:
          value:
            model: claude-opus-5
            conv: c_9f3a

    ErrorCode:
      type: string
      description: |
        The only field to branch on. Stable, permanent, lower snake case. A code may be retired
        only in a major version, and only if no client could reasonably depend on it.

        The enum is the catalogue by reference, and a contract test asserts the two match, so the
        service cannot raise a code that is not in
        [error-catalog.md](../../docs/product/error-catalog.md).
      enum:
        - validation_failed
        - invalid_amount
        - invalid_window
        - invalid_timezone
        - missing_idempotency_key
        - unauthorized
        - api_key_invalid
        - insufficient_scope
        - feature_not_in_plan
        - feature_archived
        - tenant_suspended
        - tenant_not_found
        - feature_not_found
        - plan_not_found
        - payload_too_large
        - idempotency_key_reuse
        - plan_in_use
        - feature_in_use
        - feature_key_exists
        - tenant_exists
        - tenant_deleted
        - plan_key_exists
        - refund_exceeds_grant
        - grant_exceeds_ceiling
        - reset_not_supported
        - feature_unit_immutable
        - resource_version_conflict
        - confirmation_required
        - quota_exceeded
        - rate_limited
        - service_unavailable
        - control_plane_unavailable
        - internal_error
        - not_implemented

    ErrorResponse:
      type: object
      description: |
        The one error shape, everywhere, and it is non-negotiable. No endpoint returns a bare
        `400` or a bare `500` without it.

        `additionalProperties: false` here is what makes a typo in an error field a visible
        defect rather than a silently dropped key.
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          description: |
            The error itself, nested under `error` so the envelope is extensible. `code` is the
            contract; `message` is not.
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: |
                Human-readable and may improve between releases. **Never parse it.** Branch on
                `code` and on `details`.
            request_id:
              $ref: '#/components/schemas/RequestId'
            retry_after_ms:
              type: integer
              format: int64
              minimum: 0
              description: |
                Present only when retrying is correct. On `quota_exceeded` it is **absent**,
                because the wait is a calendar duration in `details.cycle_end` and a small number
                here would invite a hammering loop.
            details:
              $ref: '#/components/schemas/ErrorDetails'

    ErrorDetails:
      type: object
      description: |
        Code-specific and additive across versions. Every code-specific field lives **here**, not
        beside `code`, which is what keeps the envelope one shape everywhere.

        Additive means a field may be added without a version bump. It does not mean a field's
        type or meaning may change, and a client must tolerate a field it does not know.
      additionalProperties: true
      examples:
        validation:
          summary: Aggregated field errors
          value:
            errors:
              - field: amount
                issue: must be an integer, got 4200.0

    MeteredRequest:
      type: object
      description: |
        The body of `consume`, `refund` and `check`. It is the same body on all three, because the
        three differ in what they do with it rather than in what they need.
      additionalProperties: false
      required: [feature_key, amount, tenant_external_id]
      properties:
        feature_key:
          allOf:
            - $ref: '#/components/schemas/FeatureKey'
          description: |
            A **single** key, never an array. One feature per call, by design: a bundle would have
            to attribute its cost across features, which breaks the per-feature event model and
            the idempotency fingerprint, and a partial bundle failure is a state the caller cannot
            reason about. A bundle is two calls ([Q-05](../../docs/product/assumptions-and-open-questions.md#2-open-questions)).
        amount:
          $ref: '#/components/schemas/Amount'
        tenant_external_id:
          allOf:
            - $ref: '#/components/schemas/ExternalId'
          description: The customer never handles an internal `tenant_id`.
        metadata:
          $ref: '#/components/schemas/Metadata'
        window:
          type: string
          description: |
            v0.2. Omitted means the anchored cycle, which is the only cadence in v0.1
            (ADR-0008). A window that disagrees with the feature's cadence is
            `400 invalid_window`, and supplying any window on a v0.1 build is also
            `invalid_window`, because the two cadences are never silently mixed.
          enum: [rolling_5m, rolling_15m, rolling_1h, rolling_6h, rolling_24h, rolling_7d, rolling_30d]
      examples:
        metered:
          value:
            feature_key: llm.tokens.output
            amount: 4200
            tenant_external_id: acme-prod-01
            metadata:
              model: claude-opus-5
              conv: c_9f3a

    MeteredResponse:
      description: |
        One feature's numbers after a metered call, describing the cycle the call fell in. A replay
        returns the same body with `replayed: true`, because a retrying client must not be able to
        tell a replay from a second charge by its shape alone (DR-049).
      type: object
      additionalProperties: false
      required: [tenant_external_id, feature_key, balance, limit, bonus, consumed, cycle_start, cycle_end, replayed]
      properties:
        tenant_external_id:
          $ref: '#/components/schemas/ExternalId'
        feature_key:
          $ref: '#/components/schemas/FeatureKey'
        balance:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: The remaining balance **after** the deduction.
        limit:
          $ref: '#/components/schemas/Limit'
        bonus:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: Cycle-scoped granted quota. It does not survive the boundary (DR-020).
        consumed:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: |
            The amount the **original** call applied, returned unchanged on a replay because the
            replayed response is byte-identical (DR-026). `balance` minus `consumed` is the
            balance before the original deduction.
        cycle_start:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        cycle_end:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        replayed:
          type: boolean
          description: |
            Whether this response is a replay of a stored one. A client that needs to know
            whether **this call** moved anything reads this, rather than inferring it from
            arithmetic, and it can also read the `Idempotent-Replay` header.

    CheckResponse:
      type: object
      description: The answer to "would this be allowed", which is always a `200` when answerable.
      additionalProperties: false
      required: [allowed, balance, limit, bonus, requested, cycle_end]
      properties:
        allowed:
          type: boolean
          description: |
            A denial is `allowed: false` at `200`, **not** a `429` (DR-024). A `429` from this
            route means the service is rate-limiting you.
        balance:
          $ref: '#/components/schemas/Amount'
        limit:
          $ref: '#/components/schemas/Limit'
        bonus:
          $ref: '#/components/schemas/Amount'
        requested:
          $ref: '#/components/schemas/Amount'
        cycle_end:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: When a currently-denied amount would become available.

    BalanceEntry:
      description: |
        One feature's balance for the current cycle. A feature the tenant's plan does not include is
        absent rather than zero, so a caller can tell an omission from an exhausted allowance.
      type: object
      additionalProperties: false
      required: [feature_key, balance, limit, bonus, consumed, cycle_start, cycle_end]
      properties:
        feature_key:
          $ref: '#/components/schemas/FeatureKey'
        balance:
          $ref: '#/components/schemas/Amount'
        limit:
          $ref: '#/components/schemas/Limit'
        bonus:
          $ref: '#/components/schemas/Amount'
        consumed:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: Consumption so far in this cycle, as recorded in the ledger.
        cycle_start:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        cycle_end:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    BalanceResponse:
      description: |
        Every feature's balance for one tenant, in one call. Paged by feature rather than by tenant,
        because the question is never about a tenant on its own.
      type: object
      additionalProperties: false
      required: [tenant_external_id, entries]
      properties:
        tenant_external_id:
          $ref: '#/components/schemas/ExternalId'
        entries:
          type: array
          description: |
            One entry, or the tenant's full set. The set is bounded by the plan's entitlement
            count (NFR-T5), so the unbounded case does not exist. An empty page is `[]`, never
            `null`.
          items:
            $ref: '#/components/schemas/BalanceEntry'

    Feature:
      description: |
        One feature in Quotacore's catalogue. A feature is the thing that is metered; a plan says how
        much of it a tenant gets, and a tenant is assigned to exactly one plan (UC-05).
      type: object
      additionalProperties: false
      required: [id, feature_key, name, unit, kind, description, state, version, created_at, updated_at, archived_at]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Internal, and what `/v1/admin/features/{id}` takes. Unlike a tenant's `external_id`
            there is no customer-chosen form, because a feature is Quotacore's own catalogue entry.
        feature_key:
          allOf:
            - $ref: '#/components/schemas/FeatureKey'
          description: Immutable once created (INV-F3).
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The operator's display name. Cosmetic, and the only mutable field but `description`.
        unit:
          allOf:
            - $ref: '#/components/schemas/Unit'
          description: |
            Immutable once the feature is referenced by an assignment or an event. Reinterpreting
            historical amounts is not allowed, and that is what `feature_unit_immutable` is for
            (INV-F2).
        kind:
          $ref: '#/components/schemas/FeatureKind'
        description:
          type: string
          maxLength: 2000
          description: Free text for an operator reading a plan. Empty when there is nothing to say.
        state:
          $ref: '#/components/schemas/ArchiveState'
        version:
          $ref: '#/components/schemas/Version'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        archived_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: Null unless `state` is `archived`.

    FeatureCreate:
      description: |
        Create a feature. The catalogue is small and edited deliberately, because a feature key whose
        meaning later changes is a change to history (INV-F2, INV-F3).
      type: object
      additionalProperties: false
      required: [feature_key, name, unit]
      properties:
        feature_key:
          allOf:
            - $ref: '#/components/schemas/FeatureKey'
          description: Immutable. A duplicate is `409 feature_key_exists`.
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The operator's display name for the new feature.
        unit:
          allOf:
            - $ref: '#/components/schemas/Unit'
          description: Immutable once referenced, and documented on the feature rather than inferred.
        description:
          type: string
          maxLength: 2000
          description: Optional free text. Absent and `''` are the same thing, which is why it defaults to `''`.
          default: ''

    FeatureUpdate:
      type: object
      description: |
        A rename. `unit` and `feature_key` are absent by design: offering an immutable field and
        then refusing it is a worse API than not offering it.
      additionalProperties: false
      required: [version]
      properties:
        version:
          allOf:
            - $ref: '#/components/schemas/Version'
          description: |
            Required. The optimistic-concurrency token from the `GET` that preceded this call. A
            mismatch is `409 resource_version_conflict` with the current version in `details`.
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The new display name, replacing the current one.
        description:
          type: string
          maxLength: 2000
          description: Replaces the current free text. `''` clears it, so clearing is an explicit act.

    FeatureList:
      description: |
        A page of the feature catalogue, for a picker or a review. Features are created and archived,
        never deleted, so a historical event always resolves to something (UC-05).
      type: object
      additionalProperties: false
      required: [features]
      properties:
        features:
          type: array
          description: The page of features. An empty page is `[]`, never `null`.
          items:
            $ref: '#/components/schemas/Feature'
        next_cursor:
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'
          description: Null on the last page. An empty page is an empty array, never `null`.

    PlanEntitlement:
      type: object
      description: One feature's allowance in a plan.
      additionalProperties: false
      required: [feature_key, limit, reset_interval]
      properties:
        feature_key:
          $ref: '#/components/schemas/FeatureKey'
        limit:
          $ref: '#/components/schemas/Limit'
        reset_interval:
          $ref: '#/components/schemas/ResetInterval'

    Plan:
      description: |
        One plan: the offer a tenant is assigned to. A plan is a bounded set of entitlements and
        nothing else â€” no tenant, no key and no balance (DR-011).
      type: object
      additionalProperties: false
      required: [id, plan_key, name, description, state, version, entitlements, created_at, updated_at, archived_at]
      properties:
        id:
          type: string
          format: uuid
          description: Internal, and what `/v1/admin/plans/{id}` and `/v1/admin/plans/{id}/impact` take.
        plan_key:
          $ref: '#/components/schemas/PlanKey'
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The operator's display name for the plan.
        description:
          type: string
          maxLength: 2000
          description: Free text for an operator reading the plan. Empty when there is nothing to say.
        state:
          $ref: '#/components/schemas/ArchiveState'
        version:
          $ref: '#/components/schemas/Version'
        entitlements:
          type: array
          description: |
            At most 100. The bound is a documented validation limit rather than a struct size, so
            a larger plan is a `400 validation_failed` rather than a slow request (NFR-T5).
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/PlanEntitlement'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        archived_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    PlanCreate:
      description: |
        Create a plan, entitlements included. A plan is created whole, because a plan with no
        entitlements is not a plan (UC-11).
      type: object
      additionalProperties: false
      required: [plan_key, name, entitlements]
      properties:
        plan_key:
          allOf:
            - $ref: '#/components/schemas/PlanKey'
          description: A duplicate is `409 plan_key_exists`.
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The operator's display name for the new plan.
        description:
          type: string
          maxLength: 2000
          description: Optional free text. Absent and `''` are the same thing, which is why it defaults to `''`.
          default: ''
        entitlements:
          type: array
          description: |
            The whole offer, 1 to 100 features. The upper bound is a documented validation limit
            rather than a struct size, so a larger plan is a `400 validation_failed` rather than a
            slow request (NFR-T5).
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/PlanEntitlement'

    PlanUpdate:
      type: object
      description: |
        An edit to a plan's entitlements. It applies to new assignments immediately and to
        existing tenants at their next boundary; it does not touch an open balance and it does not
        move a boundary (DR-014).
      additionalProperties: false
      required: [version]
      properties:
        version:
          allOf:
            - $ref: '#/components/schemas/Version'
          description: |
            Required. The plan is an offer that governs a customer's money, so last-write-wins is
            not acceptable: a mismatch is `409 resource_version_conflict` (FS-12).
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The new display name, replacing the current one.
        description:
          type: string
          maxLength: 2000
          description: Replaces the current free text. `''` clears it, so clearing is an explicit act.
        entitlements:
          type: array
          description: |
            **Replaces the whole set.** A partial update of a bounded set is an ambiguity, and a
            plan is edited as one offer.
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/PlanEntitlement'

    PlanApplyRequest:
      description: |
        Re-anchor every tenant assigned to a plan. It is the only control-plane write that touches
        tenants it was not addressed to, and the reason a reason is required is that a decision with a
        blast radius is a decision worth reading later (DR-014).
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: |
            Required and audited. Re-anchoring every assigned tenant is a decision with a blast
            radius, and a decision with a blast radius is one whose reason is worth having later.
        confirmation_token:
          type: string
          description: |
            Present only when re-issuing after `409 confirmation_required`. Single-use, bound to
            the plan `resource_version` it was issued against, and expiring on
            `QUOTACORE_CONFIRMATION_TTL`, because an abandoned token must not accumulate in a
            store that cannot evict (DR-048).
          pattern: '^cnf_[0-9A-HJKMNP-TV-Z]{26}$'
          examples:
            token:
              value: cnf_01J8Z6M2QK9V3X7B4C0N5TDEFA

    PlanApplied:
      description: |
        The outcome of a completed apply, so a caller can record what happened without re-reading the
        plan and hoping it has not been edited since (UC-18).
      type: object
      additionalProperties: false
      required: [plan_key, affected_tenants, applied_at, version]
      properties:
        plan_key:
          $ref: '#/components/schemas/PlanKey'
        affected_tenants:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many tenants were re-anchored, matching the `affected_tenants` the operator was
            shown in the confirmation.
        applied_at:
          $ref: '#/components/schemas/Timestamp'
        version:
          allOf:
            - $ref: '#/components/schemas/Version'
          description: The plan's version after the apply.

    PlanImpact:
      type: object
      description: |
        What an edit would affect, read-only. Nothing is re-anchored, no audit row records a
        mutation and no token is issued (UC-19).
      additionalProperties: false
      required: [plan_key, affected_tenants, earliest_cycle_end, exceeds_confirmation_threshold]
      properties:
        plan_key:
          $ref: '#/components/schemas/PlanKey'
        affected_tenants:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many tenants the edit would affect, which is the number
            `exceeds_confirmation_threshold` compares against the configured threshold.
        earliest_cycle_end:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: |
            The earliest `cycle_end` among affected tenants, or null when none are affected. It is
            the same value `confirmation_required` reports, so the common case is a quiet read
            rather than a `409`.
        exceeds_confirmation_threshold:
          type: boolean
          description: |
            Whether `affected_tenants` is above `QUOTACORE_PLAN_APPLY_CONFIRM_THRESHOLD`. The
            operator can tell whether to expect a confirmation without provoking one.

    PlanList:
      description: |
        A page of plans, for a picker or a review.
      type: object
      additionalProperties: false
      required: [plans]
      properties:
        plans:
          type: array
          description: The page of plans. An empty page is `[]`, never `null`.
          items:
            $ref: '#/components/schemas/Plan'
        next_cursor:
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'

    TenantMetadata:
      type: object
      description: |
        A small JSON object on the tenant, explicitly not PII, not indexed by content and excluded
        from logs (DR-043, NFR-O6). Distinct from a request body's `metadata`, which is never
        returned.
      additionalProperties: true

    Tenant:
      description: |
        One tenant: the customer Quotacore meters. `external_id` is the customer's identifier, and
        every other field is either derived from it or operational bookkeeping (DR-001).
      type: object
      additionalProperties: false
      required: [id, external_id, display_name, plan_key, timezone, state, anchor_at, version, created_at, updated_at, deleted_at, metadata]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Internal.             The customer uses `external_id`; this exists for the audit log's
            `subject_id`.
        external_id:
          $ref: '#/components/schemas/ExternalId'
        display_name:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            A label for an operator reading a tenant list. Not an identity and not a lookup key:
            two tenants may share one, so the uniqueness rule is on `external_id` alone.
        plan_key:
          $ref: '#/components/schemas/PlanKey'
        timezone:
          type: string
          description: |
            An IANA name. The tenant's cycle boundaries are computed in this zone, so a wrong zone
            is a wrong bill. Abbreviations are `400 invalid_timezone`; a timezone is a set of rules
            and an abbreviation is not one (ADR-0007).
          pattern: '^[A-Za-z][A-Za-z0-9_+-]*(?:/[A-Za-z0-9_+-]+)+$'
          examples:
            berlin:
              value: Europe/Berlin
        state:
          $ref: '#/components/schemas/TenantState'
        anchor_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: |
            The tenant's **only** per-tenant cycle state (DR-002). There is deliberately no stored
            current window: a stored window that could disagree with the anchor is exactly the
            defect the pure-function design removes, and boundaries are computed from the anchor
            in the application, in UTC, with the zone applied to the arithmetic (ADR-0003).
        version:
          $ref: '#/components/schemas/Version'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        deleted_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: |
            Set by a soft delete, which is **not retroactive**: events and audit rows stay
            queryable, which is what makes a dispute answerable after a churn event (T-15). There
            is no undelete.
        metadata:
          $ref: '#/components/schemas/TenantMetadata'

    TenantCreate:
      description: |
        Provision a tenant on a plan. The cycle starts now, at the anchor, and the allowance is
        materialised immediately rather than on first use, so a missing balance is a defect and not a
        lazy read (DR-002, DR-045).
      type: object
      additionalProperties: false
      required: [external_id, display_name, plan_key]
      properties:
        external_id:
          allOf:
            - $ref: '#/components/schemas/ExternalId'
          description: |
            Your identifier for this tenant. A duplicate is `409 tenant_exists`, deliberately not
            idempotent, so a provisioning bug surfaces instead of being hidden.
        display_name:
          type: string
          minLength: 1
          maxLength: 200
          description: An operator-facing label. Not unique, and never a lookup key.
        plan_key:
          $ref: '#/components/schemas/PlanKey'
        timezone:
          type: string
          description: |
            An IANA name; defaults to `UTC`. The zone the tenant's cycle boundaries are computed
            in.
          pattern: '^[A-Za-z][A-Za-z0-9_+-]*(?:/[A-Za-z0-9_+-]+)+$'
          default: UTC
        metadata:
          $ref: '#/components/schemas/TenantMetadata'

    TenantUpdate:
      type: object
      description: |
        A change to a tenant. **Changing `plan_key` is a hard reset**: the new limits apply
        immediately, the anchor is set to now, and the previous balance is discarded rather than
        prorated, recorded as a `plan_changed` event so the discard is visible (DR-013).

        Proration is deferred deliberately. Prorating a limit is a claim about time the customer
        did not buy; the balance was for the cycle that just ended.
      additionalProperties: false
      required: [version]
      properties:
        version:
          allOf:
            - $ref: '#/components/schemas/Version'
          description: |
            Required. The optimistic-concurrency token. A mismatch is
            `409 resource_version_conflict`.
        display_name:
          type: string
          minLength: 1
          maxLength: 200
          description: The new operator-facing label, replacing the current one.
        plan_key:
          allOf:
            - $ref: '#/components/schemas/PlanKey'
          description: A change here starts a fresh cycle and discards the open balance.
        timezone:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_+-]*(?:/[A-Za-z0-9_+-]+)+$'
          description: |
            An IANA name, as on `Tenant.timezone`, and an abbreviation is `400
            invalid_timezone` for the same reason. The zone boundaries are recomputed from the
            unchanged anchor, so this moves future boundaries and leaves past ones alone.
        metadata:
          $ref: '#/components/schemas/TenantMetadata'

    TenantList:
      description: |
        A page of tenants, for an operator. Admin-scoped, because it enumerates other customers.
      type: object
      additionalProperties: false
      required: [tenants]
      properties:
        tenants:
          type: array
          description: The page of tenants. An empty page is `[]`, never `null`.
          items:
            $ref: '#/components/schemas/Tenant'
        next_cursor:
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'
          description: |
            Null on the last page. Totals are deliberately not returned: a count over a large
            tenant table is a slow query pretending to be metadata.

    Cursor:
      type: string
      description: |
        An opaque, signed pagination cursor. Never parse it and never construct one. A tampered
        cursor is `400 validation_failed`, not a silent full scan.
      minLength: 1
      maxLength: 512
      examples:
        cursor:
          value: eyJjcmVhdGVkX2F0IjoiMjAyNi0wOS0yOVQwMjoxMToySisic29ydCI6ImRlc2MifQ

    ReasonRequest:
      type: object
      description: A state-changing admin call with a mandatory reason, audited with before and after.
      additionalProperties: false
      required: [version, reason]
      properties:
        version:
          allOf:
            - $ref: '#/components/schemas/Version'
          description: The optimistic-concurrency token. A mismatch is `409 resource_version_conflict`.
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: |
            Required. Every administrative mutation writes an audit row in the same transaction as
            the mutation (NFR-D4), and a reason is the part of that row a human reads later.

    ArchiveRequest:
      description: |
        Archive a plan or a feature. Archiving is not deletion: the record keeps its history and stops
        being assignable, and archiving again is what reverses it (INV-P2, UC-13).
      type: object
      additionalProperties: false
      required: [version, reason]
      properties:
        version:
          allOf:
            - $ref: '#/components/schemas/Version'
          description: The optimistic-concurrency token.
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: |
            Required and audited. Archiving hides a plan or feature from new assignments, so the
            reason is what an operator reads to know whether it was deliberate.

    DeleteRequest:
      description: |
        Soft-delete a tenant. Deletion is terminal for the tenant, so the open balance is not re-granted
        and the ledger is kept, because a deleted tenant still has events (UC-14).
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: |
            Required and audited. Soft deletion is terminal, so the reason is the only record of
            why it happened.

    GrantRequest:
      type: object
      description: |
        Add cycle-scoped bonus quota. A grant does not survive the boundary: a bonus is a gesture
        and a limit is a contract (DR-019, DR-020).
      additionalProperties: false
      required: [feature_key, amount, reason]
      properties:
        feature_key:
          $ref: '#/components/schemas/FeatureKey'
        amount:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: |
            A grant only adds, so it is never negative. A grant on a `never` entitlement
            increases the balance with no ceiling tied to a cycle and no expiry.
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: Required, and audited. Goodwill is a decision, not a correction.

    SetRequest:
      type: object
      description: |
        Set a balance to an exact value. The blunt instrument, and the right one when a migration
        produced a number that is known to be wrong.
      additionalProperties: false
      required: [feature_key, value, reason]
      properties:
        feature_key:
          $ref: '#/components/schemas/FeatureKey'
        value:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: The balance after this call.
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: |
            Required and audited. Overwriting a balance destroys the previous figure, so the reason
            is the only record of what it was replaced by.

    ForceRolloverRequest:
      type: object
      description: |
        Roll one feature's cycle over now, applying the next cycle's allowance immediately. It is
        audited and recorded as a `force_rolled_over` event.
      additionalProperties: false
      required: [feature_key, reason]
      properties:
        feature_key:
          $ref: '#/components/schemas/FeatureKey'
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: |
            Required and audited. Rolling a cycle over early gives the tenant its next allowance
            now, so the reason is the record of who decided to and why.

    OverrideUpsert:
      type: object
      description: |
        Set or replace a per-feature override. An override is a **contract term** and outranks the
        plan: it survives later plan edits, because a plan is an offer and an override is what one
        customer signed for (DR-011).

        Clearing an override is `DELETE /v1/admin/tenants/{id}/overrides/{feature_key}`, not this
        route, because the storage cannot represent an override that sets nothing.

        **`limit_value` and `interval` are both required and both nullable.** UC-13 says "a limit,
        a reset interval, or both", and a required-but-nullable field is how "this aspect is not
        overridden" is stated without ambiguity. Requiring the key is deliberate: absence would
        mean two things, that the aspect is inherited and that the operator forgot it, and a
        quota system should not have a wire format with those two readings.

        **At least one of the two must be non-null, and this schema does not enforce that.** It is
        the one constraint in the contract that lives in the data store, as
        `tenant_overrides_not_empty`, and a request that sends both null is
        `400 validation_failed`. The reason is recorded here rather than papered over: expressing
        it in JSON Schema needs an `anyOf` over object branches, and the generator
        (ogen 1.24.0) cannot generate that, failing with "complex anyOf is not implemented yet".
        Silently dropping the constraint from the document to make the generator happy would
        leave a reader believing the wire format guarantees something it does not.

        The rule is normative in api-conventions.md section 7.4, which states the
        presence-and-null convention and the division of labour between the schema and the store.
      additionalProperties: false
      required: [feature_key, limit_value, interval]
      properties:
        feature_key:
          $ref: '#/components/schemas/FeatureKey'
        limit_value:
          oneOf:
            - $ref: '#/components/schemas/Limit'
            - type: 'null'
          description: |
            Null means "inherit the limit from the plan for this aspect". A non-null value may
            exceed the plan's limit: that is the mechanism for custom limits for an enterprise
            customer (DR-015).
        interval:
          oneOf:
            - $ref: '#/components/schemas/ResetInterval'
            - type: 'null'
          description: Null means "inherit the cadence from the plan".
        apply_at:
          allOf:
            - $ref: '#/components/schemas/OverrideApplyAt'
          description: |
            `immediate` by default. A mode, not a timestamp; the instant an override takes effect
            is always the tenant's next boundary, computed rather than stored.
        version:
          allOf:
            - $ref: '#/components/schemas/Version'
          description: |
            Optional expected version for the existing override. Omitted means "create or replace
            without a concurrency check", which is appropriate when a single operator is the only
            writer.
      examples:
        limit:
          summary: Ten times the plan limit, from the next boundary
          value:
            feature_key: llm.tokens.output
            limit_value: 10000000
            interval: null
            apply_at: next_boundary
        interval:
          summary: Custom cadence, limit inherited from the plan
          value:
            feature_key: api.requests
            limit_value: null
            interval: weekly
            apply_at: immediate
        both:
          summary: A limit and a cadence, neither inherited
          value:
            feature_key: api.requests
            limit_value: 5000
            interval: weekly
            apply_at: immediate

    OverrideClearRequest:
      type: object
      description: |
        The body of the override-clearing `DELETE`.

        `apply_at` is in the body rather than a query parameter because it changes **when** money
        is owed, and a `DELETE` that silently meant "now" would be a surprise in a billing system.
      additionalProperties: false
      required: [apply_at]
      properties:
        apply_at:
          $ref: '#/components/schemas/OverrideApplyAt'
      examples:
        clear:
          summary: Restore the plan value from the next boundary
          value:
            apply_at: next_boundary

    Override:
      description: |
        One per-feature override on one tenant. An override is a contract term and outranks the plan,
        which is why it is modelled separately rather than expressed as a plan edit (DR-011).
      type: object
      additionalProperties: false
      required: [id, feature_key, limit_value, interval, apply_at, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Internal. An override is addressed by tenant and `feature_key` rather than by this id,
            so there is at most one per pair.
        feature_key:
          $ref: '#/components/schemas/FeatureKey'
        limit_value:
          oneOf:
            - $ref: '#/components/schemas/Limit'
            - type: 'null'
          description: Null when the limit is inherited from the plan.
        interval:
          oneOf:
            - $ref: '#/components/schemas/ResetInterval'
            - type: 'null'
          description: Null when the cadence is inherited from the plan.
        apply_at:
          $ref: '#/components/schemas/OverrideApplyAt'
        version:
          $ref: '#/components/schemas/Version'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    UsageEvent:
      type: object
      description: |
        One ledger row. The ledger is append-only (INV-U2), reconstructed rather than trusted, and
        delivered downstream best effort and at-least-once, so `event_id` deduplication at the
        consumer is part of the contract rather than an oversight (ADR-0016).
      additionalProperties: false
      required: [id, tenant_external_id, feature_key, cycle_index, delta, balance_after, source, event_type, request_id, idempotency_key, cycle_start, cycle_end, occurred_at]
      properties:
        id:
          type: string
          format: uuid
          description: The `event_id` a downstream consumer deduplicates on.
        tenant_external_id:
          $ref: '#/components/schemas/ExternalId'
        feature_key:
          $ref: '#/components/schemas/FeatureKey'
        cycle_index:
          type: integer
          format: int64
          minimum: 0
          description: |
            Which cycle this was, monotonically increasing. A memo for reconciliation and
            pagination, **not** a second authority: the window itself is recomputed from the
            tenant's anchor, and a disagreement here is a reconciliation finding rather than a
            truth.
        delta:
          type: integer
          format: int64
          description: |
            Signed and **never zero** (a database constraint), so an `amount: 0` consume records no
            event at all. Negative consumes, positive refunds, grants, sets and rollovers.
          minimum: -9007199254740991
          maximum: 9007199254740991
          examples:
            consumed:
              summary: A consumption
              value: -4200
            rolled:
              summary: A rollover
              value: 1000000
        balance_after:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: |
            Stored so history is readable without replaying, and so the reconciliation identity of
            DR-042 is directly checkable: the opening allowance plus the sum of the deltas equals
            this.
        source:
          $ref: '#/components/schemas/EventSource'
        event_type:
          $ref: '#/components/schemas/EventType'
        request_id:
          oneOf:
            - $ref: '#/components/schemas/RequestId'
            - type: 'null'
          description: Null for `system` events, which no request caused.
        idempotency_key:
          oneOf:
            - $ref: '#/components/schemas/IdempotencyKey'
            - type: 'null'
          description: |
            The customer's key, on `consumed` and `refunded`. Filtering by it is how a disputed
            charge is resolved: the recorded outcome shows whether it was applied once or twice
            (UC-16).
        cycle_start:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        cycle_end:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'

    UsageEventList:
      description: |
        A page of the ledger, newest first, for reconciliation and for settling a disputed charge
        (UC-16).
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          description: Newest first, with a stable tiebreaker. An empty page is `[]`, never `null`.
          items:
            $ref: '#/components/schemas/UsageEvent'
        next_cursor:
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'

    AuditEntry:
      type: object
      description: |
        One administrative mutation, written in the same transaction as the mutation (NFR-D4). An
        audit log written best effort is a log, not an audit trail.
      additionalProperties: false
      required: [id, actor, actor_key_id, action, subject_type, subject_id, before, after, request_id, occurred_at]
      properties:
        id:
          type: string
          format: uuid
          description: The audit row's own identifier, for citing a row rather than for looking one up by resource.
        actor:
          type: string
          description: |
            `bootstrap`, `cli:<host>`, or a key's name. A key's name rather than its secret, so an
            audit record can be shown to someone without handing them a credential (DR-043).
          examples:
            key:
              value: acme-prod-deploy
        actor_key_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
          description: Null for the bootstrap actor and for CLI calls, which have no key.
        action:
          type: string
          description: A dotted action name.
          pattern: '^[a-z_]+\.[a-z_]+$'
          examples:
            apply:
              value: plan.apply_now
        subject_type:
          type: string
          enum: [tenant, plan, feature, api_key]
          description: Which kind of resource changed, so a log reader can filter by it.
        subject_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
          description: |
            The resource's internal id, or null when the mutation has no single subject — a plan
            `apply-now` touches every assigned tenant, so the tenants are not recorded here one by
            one.
        before:
          description: The resource before the change, or null when it was created.
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        after:
          description: The resource after the change, or null when it was deleted.
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        request_id:
          $ref: '#/components/schemas/RequestId'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'

    AuditEntryList:
      description: |
        A page of the audit log, newest first. Append-only, and the reason a mutation cannot be
        quietly undone after the fact (NFR-D4).
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          description: The page of entries, newest first. An empty page is `[]`, never `null`.
          items:
            $ref: '#/components/schemas/AuditEntry'
        next_cursor:
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'

    Key:
      type: object
      description: |
        Key metadata. The secret is never present here and no route will return it (INV-K3).
      additionalProperties: false
      required: [id, name, prefix, scope, state, created_at, expires_at, last_used_at, revoked_at]
      properties:
        id:
          type: string
          format: uuid
          description: Internal, and what `/v1/admin/keys/{id}` takes.
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Unique. A duplicate name is `400 validation_failed` naming the field.
        prefix:
          type: string
          description: |
            The public, unique part of the key. It appears in this list, in the audit log and in
            logs **in place of the key**, which is how a key leaked in a support ticket is traced
            to the key that leaked (DR-043, K-1).
          pattern: '^[0-9a-f]{8,64}$'
        scope:
          $ref: '#/components/schemas/KeyScope'
        state:
          $ref: '#/components/schemas/KeyState'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: |
            Optional at issue time, enforced on every request. A key past this is
            `401 api_key_invalid`.
        last_used_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        revoked_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: |
            Revocation is immediate and **effective on the next request with no cache delay**,
            because the cache stores the hash and the state and revocation bumps the version
            (UC-15, K-2).

    KeyCreate:
      description: |
        Issue an API key. The plaintext is returned once, on this route and nowhere else
        (ADR-0012).
      type: object
      additionalProperties: false
      required: [name, scope]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            Unique and operator-chosen. It is the `actor` on every audit row this key produces, so
            it should say what the key is for rather than who typed it.
        scope:
          allOf:
            - $ref: '#/components/schemas/KeyScope'
          description: |
            Visible in the token itself, so a scope mismatch is not a debugging session. Issuance
            is an admin action and is audited, and it is a per-customer decision: a runtime key is
            a credential for the whole instance.
        expires_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: Optional. An expiry is a limit on a credential's blast radius.

    KeyCreated:
      type: object
      description: |
        The **only** response that ever contains the plaintext key. It is not recoverable
        afterwards; only an Argon2id hash and the public prefix are stored, and the hash is
        deliberately not indexed because indexing a verifier invites a timing-oracle design
        (ADR-0012).

        A lost key is replaced, not recovered (UC-15).
      additionalProperties: false
      required: [id, name, prefix, scope, state, created_at, expires_at, key]
      properties:
        id:
          type: string
          format: uuid
          description: The new key's id, as it appears in every later `Key` response.
        name:
          type: string
          description: The name chosen at creation, echoed back.
        prefix:
          type: string
          description: The public prefix, so it can be recorded where the key cannot.
        scope:
          $ref: '#/components/schemas/KeyScope'
        state:
          $ref: '#/components/schemas/KeyState'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        key:
          type: string
          description: |
            The plaintext credential, in the form `qc_<scope>_<prefix>.<secret>`. Shown once.
          pattern: '^qc_(runtime|admin)_[0-9a-f]{8,64}\.[A-Za-z0-9_-]{16,}$'

    KeyList:
      description: |
        A page of key metadata. The secret is never present, and no route will return it (INV-K3).
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          description: The page of keys. An empty page is `[]`, never `null`.
          items:
            $ref: '#/components/schemas/Key'
        next_cursor:
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'

    DependencyHealth:
      type: object
      description: |
        One dependency's health, reported as data. A failure here is a `200` with
        `healthy: false`, never an error envelope, because a status endpoint that fails when a
        dependency is down cannot report that it is down.
      additionalProperties: false
      required: [name, healthy, latency_ms, error]
      properties:
        name:
          type: string
          enum: [redis, postgres]
          description: Which dependency this row is about.
        healthy:
          type: boolean
          description: |
            Whether a probe succeeded. `false` is reported here rather than as an error envelope,
            so the status endpoint can still answer the question that was asked of it.
        latency_ms:
          oneOf:
            - type: number
              format: double
              minimum: 0
            - type: 'null'
          description: The probe's round-trip time, or null when the probe did not complete.
        error:
          oneOf:
            - type: string
            - type: 'null'
          description: 'The failure reason, and safe to show: it is a connection error, not data.'

    CacheStats:
      type: object
      description: |
        The configuration snapshot's size. An empty key space after a restart is a normal state and
        it is reported as such rather than inferred from a failing request.
      additionalProperties: false
      required: [entries, tenants, features, size_bytes]
      properties:
        entries:
          type: integer
          format: int64
          minimum: 0
          description: Configuration entries held in the snapshot, across all tenants and features.
        tenants:
          type: integer
          format: int64
          minimum: 0
          description: Tenants the snapshot currently covers. Zero right after a restart is normal.
        features:
          type: integer
          format: int64
          minimum: 0
          description: Features the snapshot currently covers.
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            Approximate memory held by the snapshot. Sizing the store needs this number, which is
            why it is reported rather than estimated by a reader.

    Status:
      type: object
      description: |
        Everything an operator needs when something is wrong, in one call: dependency health, the
        build, the `tzdata` version the binary was built with, the current time and the snapshot
        size (NFR-O5).

        The `tzdata` version is reported because a boundary disagreement between a node and the
        reference tables is diagnosable if you know which tables the node used, and is not
        diagnosable otherwise (ADR-0007).
      additionalProperties: false
      required: [status, version, commit, zone_data_version, server_time, uptime_s, dependencies, cache, queue_depth, worker, ledger_dropped_total]
      properties:
        status:
          type: string
          description: |
            A single word for a dashboard. Read `dependencies` for the detail: one word cannot say
            which dependency is down, and a status that cannot is the status that gets ignored.
          enum: [ok, degraded]
        version:
          type: string
          description: The build version.
        commit:
          type: string
          description: The build commit, so a running binary is traceable to a source tree.
        zone_data_version:
          type: string
          description: The `tzdata` version the binary was built with.
        server_time:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: |
            The service's own time, so a client that disagrees can see the discrepancy instead of
            computing a silent one.
        uptime_s:
          type: integer
          format: int64
          minimum: 0
          description: |
            Seconds since this process started, which is not the same as seconds since the
            service was last healthy. A restart is visible here and not in `status`.
        dependencies:
          type: array
          description: |
            One row per dependency, and the reason to read this endpoint at all: the detail behind
            the one word in `status`.
          items:
            $ref: '#/components/schemas/DependencyHealth'
        cache:
          $ref: '#/components/schemas/CacheStats'
        queue_depth:
          type: integer
          format: int64
          minimum: 0
          description: The reset worker's queue depth (ADR-0003).
        worker:
          type: string
          description: The reset worker's state, so a stalled rollover is visible before a customer's balance is wrong.
          enum: [running, stopped, draining]
        ledger_dropped_total:
          type: integer
          format: int64
          minimum: 0
          description: |
            Ledger events the external sink failed to accept. **Non-zero means the downstream
            history is incomplete**, and that is reported rather than hidden, because a silently
            incomplete history is worse than a documented one (ADR-0016).

    HealthResponse:
      type: object
      description: |
        The probe response. Deliberately minimal: a liveness probe that inspects dependencies
        restarts a process that was not the problem.
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready]
          description: |
            `ok` from the liveness probe, `ready` from the readiness probe. The two differ
            deliberately: a process that is alive but not ready is still the right process to keep
            running.
