        The request was not applied. Nothing is charged and nothing is reserved.

        `missing_idempotency_key` and `invalid_window` are in the same `400` as
        `validation_failed` because they are the same class of mistake, but they are distinct
        codes: a client that retries with a key fixes one and not the others.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation_failed:
              $ref: '#/components/examples/ValidationFailed'
            invalid_amount:
              $ref: '#/components/examples/InvalidAmount'
            invalid_window:
              $ref: '#/components/examples/InvalidWindow'
            missing_idempotency_key:
              $ref: '#/components/examples/MissingIdempotencyKey'

    ErrorBadRequestWindow:
      x-status: 400
      x-codes: [validation_failed, invalid_window]
      description: |
        The question could not be asked. `check` takes no `Idempotency-Key` and never returns
        `quota_exceeded` or `idempotency_key_reuse`, because it mutates nothing (DR-024).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation_failed:
              $ref: '#/components/examples/ValidationFailed'
            invalid_window:
              $ref: '#/components/examples/InvalidWindow'

    ErrorBadRequestPlain:
      x-status: 400
      x-codes: [validation_failed]
      description: |
        The request was rejected and nothing changed. Validation errors aggregate, so one response
        names every offending field.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation_failed:
              $ref: '#/components/examples/ValidationFailed'

    ErrorBadRequestTimezone:
      x-status: 400
      x-codes: [validation_failed, invalid_timezone]
      description: |
        A rejected request. `invalid_timezone` is separate from `validation_failed` because the
        remedy is different and a wrong timezone is a wrong bill, not a typo.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation_failed:
              $ref: '#/components/examples/ValidationFailed'
            invalid_timezone:
              $ref: '#/components/examples/InvalidTimezone'

    ErrorUnauthorized:
      x-status: 401
      x-codes: [unauthorized, api_key_invalid]
      description: |
        No usable credential. `api_key_invalid` covers unknown, revoked, expired and malformed
        keys, and there is no recovery path for any of them: rotate.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              $ref: '#/components/examples/Unauthorized'
            api_key_invalid:
              $ref: '#/components/examples/ApiKeyInvalid'

    ErrorForbiddenEntitlement:
      x-status: 403
      x-codes: [insufficient_scope, feature_not_in_plan, feature_archived, tenant_suspended]
      description: |
        A refusal that is about the caller or the entitlement, not the request's shape. Nothing
        was charged.

        All four are `403` and they are told apart by `code`, never by status: this is the case
        the catalogue's "no code carries meaning in its HTTP status" rule exists for.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            insufficient_scope:
              $ref: '#/components/examples/InsufficientScope'
            feature_not_in_plan:
              $ref: '#/components/examples/FeatureNotInPlan'
            feature_archived:
              $ref: '#/components/examples/FeatureArchived'
            tenant_suspended:
              $ref: '#/components/examples/TenantSuspended'

    ErrorForbiddenScope:
      x-status: 403
      x-codes: [insufficient_scope]
      description: |
        A valid key with the wrong scope. `403` and not `404`, because the caller is already
        authenticated and hiding the endpoint helps nobody (FS-18).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            insufficient_scope:
              $ref: '#/components/examples/InsufficientScope'

    ErrorFeatureNotFound:
      x-status: 404
      x-codes: [feature_not_found]
      description: No such feature key on the admin API.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            feature_not_found:
              $ref: '#/components/examples/FeatureNotFound'

    ErrorPlanNotFound:
      x-status: 404
      x-codes: [plan_not_found]
      description: No such plan.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            plan_not_found:
              $ref: '#/components/examples/PlanNotFound'

    ErrorTenantNotFound:
      x-status: 404
      x-codes: [tenant_not_found]
      description: |
        Unknown or soft-deleted tenant. A soft-deleted tenant is treated exactly as absent, which
        is why this is also the answer after a soft delete (T-15).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            tenant_not_found:
              $ref: '#/components/examples/TenantNotFound'

    ErrorNotFoundResource:
      x-status: 404
      x-codes: [feature_not_found, tenant_not_found]
      description: |
        Neither the tenant nor the named feature exists. On the admin API existence is not
        hidden, because the operator is already authorised for the whole instance.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            feature_not_found:
              $ref: '#/components/examples/FeatureNotFound'
            tenant_not_found:
              $ref: '#/components/examples/TenantNotFound'

    ErrorConsumeConflict:
      x-status: 409
      x-codes: [idempotency_key_reuse, feature_not_metered]
      description: |
        A consume conflict, and no state changed. `idempotency_key_reuse` is a key first used for a
        different operation; the original record is preserved (DR-028, INV-I2), and a retry with a
        **new** key is right only if the new operation is genuinely a new one.
        `feature_not_metered` is an amount above 1 against a boolean entitlement, which has no
        counter to deduct from (DR-050).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            idempotency_key_reuse:
              $ref: '#/components/examples/IdempotencyKeyReuse'
            feature_not_metered:
              $ref: '#/components/examples/FeatureNotMetered'

    ErrorFeatureNotMetered:
      x-status: 409
      x-codes: [feature_not_metered]
      description: |
        An amount above 1 asked of a boolean entitlement. `check` answers what `consume` would, so
        it refuses the same amount rather than calling it allowed (DR-024, DR-050).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            feature_not_metered:
              $ref: '#/components/examples/FeatureNotMetered'

    ErrorRefundConflict:
      x-status: 409
      x-codes: [idempotency_key_reuse, refund_exceeds_grant, feature_not_metered]
      description: |
        A refund conflict. It never returns `quota_exceeded`: a refund cannot exceed a balance,
        and the bound it can break is `balance <= limit + bonus` (DR-019). A refund against a
        boolean entitlement is `feature_not_metered`, because there is no counter to restore
        (DR-050).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            idempotency_key_reuse:
              $ref: '#/components/examples/IdempotencyKeyReuse'
            refund_exceeds_grant:
              $ref: '#/components/examples/RefundExceedsGrant'
            feature_not_metered:
              $ref: '#/components/examples/FeatureNotMetered'

    ErrorConflictFeature:
      x-status: 409
      x-codes: [feature_key_exists, feature_in_use, feature_unit_immutable, resource_version_conflict]
      description: |
        A feature conflict, and nothing changed. `feature_unit_immutable` and
        `resource_version_conflict` are the two ways a feature mutation is refused; the other two
        are duplicate-key and still-referenced.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            feature_key_exists:
              $ref: '#/components/examples/FeatureKeyExists'
            feature_in_use:
              $ref: '#/components/examples/FeatureInUse'
            feature_unit_immutable:
              $ref: '#/components/examples/FeatureUnitImmutable'
            resource_version_conflict:
              $ref: '#/components/examples/ResourceVersionConflict'

    ErrorConflictPlan:
      x-status: 409
      x-codes: [plan_key_exists, plan_in_use, resource_version_conflict, confirmation_required]
      description: |
        A plan conflict, and **nothing changed**. `confirmation_required` is the same status
        because it also applied nothing: it is a refusal that hands back a token, not a partial
        application (DR-046).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            plan_key_exists:
              $ref: '#/components/examples/PlanKeyExists'
            plan_in_use:
              $ref: '#/components/examples/PlanInUse'
            resource_version_conflict:
              $ref: '#/components/examples/ResourceVersionConflict'
            confirmation_required:
              $ref: '#/components/examples/ConfirmationRequired'

    ErrorConfirmationRequired:
      x-status: 409
      x-codes: [confirmation_required]
      description: |
        The edit would affect more tenants than
        `QUOTACORE_PLAN_APPLY_CONFIRM_THRESHOLD` (default 50), so it applied **nothing** and
        returned a single-use token instead.

        Re-issue the identical request with `confirmation_token`. The token is bound to the plan
        `resource_version` it was issued against, so a plan edited in between is refused.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            confirmation_required:
              $ref: '#/components/examples/ConfirmationRequired'

    ErrorConflictTenant:
      x-status: 409
      x-codes: [tenant_exists, tenant_deleted, resource_version_conflict]
      description: |
        A tenant conflict, and nothing changed. `tenant_exists` is deliberately not idempotent, so
        a provisioning bug surfaces instead of being hidden.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            tenant_exists:
              $ref: '#/components/examples/TenantExists'
            tenant_deleted:
              $ref: '#/components/examples/TenantDeleted'
            resource_version_conflict:
              $ref: '#/components/examples/ResourceVersionConflict'

    ErrorConflictTenantDeleted:
      x-status: 409
      x-codes: [tenant_deleted]
      description: |
        The tenant is deleted, which is terminal, so nothing about it can change (T-7).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            tenant_deleted:
              $ref: '#/components/examples/TenantDeleted'

    ErrorConflictQuota:
      x-status: 409
      x-codes: [grant_exceeds_ceiling, reset_not_supported, feature_not_metered, feature_not_anchored, resource_version_conflict, tenant_deleted]
      description: |
        A refused administrative change to a balance. Nothing was applied in any of the six
        cases. `tenant_deleted` is a tenant whose deletion is terminal (T-7),
        `feature_not_metered` is a feature with no counter to change (DR-050), and
        `feature_not_anchored` is a rolling feature, which has no cycle balance (DR-052).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            grant_exceeds_ceiling:
              $ref: '#/components/examples/GrantExceedsCeiling'
            reset_not_supported:
              $ref: '#/components/examples/ResetNotSupported'
            feature_not_metered:
              $ref: '#/components/examples/FeatureNotMetered'
            feature_not_anchored:
              $ref: '#/components/examples/FeatureNotAnchored'
            resource_version_conflict:
              $ref: '#/components/examples/ResourceVersionConflict'

    ErrorWebhookNotFound:
      x-status: 404
      x-codes: [tenant_not_found, webhook_not_found]
      description: |
        Either no tenant has that identifier, or the tenant has no webhook. Kept apart so a route
        that reads or removes a webhook never mistakes a typo for an empty configuration.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            webhook_not_found:
              $ref: '#/components/examples/WebhookNotFound'
            tenant_not_found:
              $ref: '#/components/examples/TenantNotFound'

    ErrorKeyNotFound:
      x-status: 404
      x-codes: [api_key_not_found]
      description: |
        No API key has that id. Distinct from a successful revocation, so a mistyped id is never
        mistaken for a revoked key. List the keys and check the id.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            api_key_not_found:
              $ref: '#/components/examples/ApiKeyNotFound'

    ErrorPayloadTooLarge:
      x-status: 413
      x-codes: [payload_too_large]
      description: |
        The body was refused **before it was parsed** (NFR-T6). Absent from every read route, and
        from `DELETE .../overrides/{feature_key}`, which takes no body.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            payload_too_large:
              $ref: '#/components/examples/PayloadTooLarge'

    ErrorQuotaAndRate:
      x-status: 429
      x-codes: [quota_exceeded, rate_limited]
      description: |
        Two entirely different problems that share a status, which is why the catalogue says no
        code may carry meaning in its status alone (DR-040).

        `quota_exceeded` is the tenant's money for this cycle and is retryable at
        `details.cycle_end`, with no `Retry-After`. `rate_limited` is this service protecting
        itself and is retryable in seconds, with a `Retry-After`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            quota_exceeded:
              $ref: '#/components/examples/QuotaExceeded'
            quota_exceeded_rolling:
              $ref: '#/components/examples/QuotaExceededRolling'
            rate_limited:
              $ref: '#/components/examples/RateLimited'

    ErrorRateLimited:
      x-status: 429
      x-codes: [rate_limited]
      description: |
        This service is rate-limiting the key. Distinct from `quota_exceeded`, which is the
        tenant's allowance rather than the service's protection (DR-040).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            rate_limited:
              $ref: '#/components/examples/RateLimited'

    ErrorInternal:
      x-status: 500
      x-codes: [internal_error]
      description: |
        A defect, and **nothing was applied**. On `consume` or `refund` a `500` always means the
        balance is unchanged, because the mutation is a single atomic script execution, so a
        client-side retry is safe.

        Quote the `request_id`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internal_error:
              $ref: '#/components/examples/InternalError'

    ErrorNotImplemented:
      x-status: 501
      x-codes: [not_implemented]
      description: |
        A later-release surface called on a build or an instance that does not provide it. Not
        transient: retrying does not help. Since v0.3 the webhook routes raise it when the
        operator has not set `QUOTACORE_WEBHOOK_SIGNING_KEY`, which is how an instance that has not
        opted into egress answers (Q-42, amending Q-34).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            not_implemented:
              $ref: '#/components/examples/NotImplemented'

    ErrorControlPlaneUnavailable:
      x-status: 503
      x-codes: [control_plane_unavailable]
      description: |
        Postgres did not answer. A route that reads only the control plane cannot answer
        `service_unavailable`, because it never touches the data store. Retryable with backoff and
        jitter.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            control_plane_unavailable:
              $ref: '#/components/examples/ControlPlaneUnavailable'

    ErrorUnavailable:
      x-status: 503
      x-codes: [service_unavailable, control_plane_unavailable]
      description: |
        A dependency is unavailable. Both are retryable with backoff and jitter, and whether to
        fail **open** or **closed** is a decision your application makes deliberately
        (DR-037).

        The two codes are separate because cached tenants are unaffected when Postgres is
        unreachable, and conflating them would make an incident impossible to diagnose
        (DR-036).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            service_unavailable:
              $ref: '#/components/examples/ServiceUnavailable'
            control_plane_unavailable:
              $ref: '#/components/examples/ControlPlaneUnavailable'

  schemas:

    RequestId:
      type: string
      description: |
        A ULID or a UUID. Adopted from the inbound `X-Request-Id` when it is one of those,
        otherwise minted. It is the join key across logs, ledger events and a customer's bug
        report (NFR-S10).
      pattern: '^(?:[0-9A-HJKMNP-TV-Z]{26}|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'
      examples:
        ulid:
          summary: A ULID
          value: 01J8Z6M2QK9V3X7B4C0N5TDEFA

    IdempotencyKey:
      type: string
      description: |
        One key per logical operation, reused across every attempt including retries. The window
        is 24 hours from application and is **not** configurable, because it is a documented
        customer guarantee (DR-029).
      pattern: '^[A-Za-z0-9._:-]{8,255}$'
      examples:
        ulid:
          value: 01JCQ9W3K2M9XQ3F8V6T0B5NDE
        derived:
          summary: Derived from the customer's own durable operation identifier
          value: 'order:8841:charge'

    Timestamp:
      type: string
      description: |
        RFC 3339 with an **explicit offset**, always, including `Z`. The offset is present even
        when it is `Z` unless `Z` is the whole value, so no client branches on whether a zone is
        UTC.

        The difference this prevents is not academic: the gap between a UTC assumption and
        `Europe/Berlin` across a DST change is 31 days minus one hour, and a customer notices.
      format: date-time
      examples:
        offset:
          summary: An explicit offset
          value: '2026-10-01T00:00:00+02:00'
        utc:
          summary: The same instant in UTC
          value: '2026-09-30T22:00:00Z'

    ExternalId:
      type: string
      description: |
        Your identifier for a tenant, as in `tenant_external_id`.

        The character class **excludes `@`**, which makes it structurally impossible to store an
        email address as a tenant identifier. That is a schema-level guarantee about the absence
        of PII rather than a convention (DR-034, NFR-S2).
      pattern: '^[A-Za-z0-9._:-]{1,128}$'
      examples:
        tenant:
          value: acme-prod-01

    FeatureKey:
      type: string
      description: |
        A metered feature's key, matching the `features_key_format` constraint. The key is
        immutable once created (INV-F3).
      pattern: '^[a-z0-9](?:[a-z0-9._-]{0,62}[a-z0-9])?$'
      examples:
        dotted:
          value: llm.tokens.output

    PlanKey:
      type: string
      description: A plan key, matching the `plans_key_format` constraint.
      pattern: '^[a-z0-9][a-z0-9_-]{0,62}$'
      examples:
        plan:
          value: pro

    Unit:
      type: string
      description: |
        What one `amount` counts: `token`, `request`, `image`, and so on. The unit is documented on
        the feature and is **never inferred**, which is why it is immutable once the feature is
        used for anything (INV-F2).
      pattern: '^[a-z][a-z0-9_]{0,31}$'
      examples:
        unit:
          value: token

    Amount:
      type: integer
      description: |
        A count of the feature's unit. JSON **integers only**: `4200.0` is
        `400 validation_failed` naming the field, because accepting a float and rounding it
        silently is how a customer loses money without noticing (DR-022).

        The maximum is `2^53 - 1`, not `2^63 - 1`, and that is a scripting-language limit rather
        than a storage one: the atomic script's numbers are doubles, so a balance above `2^53 - 1`
        cannot be represented exactly by the code that enforces the ceiling. The database, the API
        and the script all reject the same values, so a metering system that silently rounds is
        avoided in favour of one that refuses the value.
      format: int64
      minimum: 0
      maximum: 9007199254740991

    Limit:
      type: integer
      description: A cycle allowance. Same integer rules and same `2^53 - 1` ceiling as `Amount`.
      format: int64
      minimum: 0
      maximum: 9007199254740991
      examples:
        monthly:
          value: 1000000

    Version:
      type: integer
      description: |
        Optimistic-concurrency token. Read it, send it back, and on a mismatch re-read before
        retrying. Last-write-wins on a resource that governs a customer's money is not acceptable
        (FS-12).
      format: int64
      minimum: 1
      examples:
        current:
          value: 7

    ResetInterval:
      type: string
      description: |
        The cadence of an entitlement. A `never` entitlement is a lifetime allowance: no boundary,
        no expiry, no rollover, and `cycle_start` and `cycle_end` are `null` (DR-008, INV-C6).
      enum: [hourly, daily, weekly, monthly, yearly, never]

    OverrideApplyAt:
      type: string
      description: |
        A **mode, not a timestamp**. `immediate` applies a limit now, re-limiting the open cycle
        and keeping what was spent; `next_boundary` applies it at the tenant's next boundary. An
        interval reaches the tenant at its next re-anchor in either mode, because that is the
        only moment a cadence change is meaningful.

        It is a mode because the actual instant an override takes effect is always the tenant's
        next boundary, computed by the cycle engine and never stored. The name is a deliberate
        wart kept for the API's benefit, and it is why the enum type exists in the schema: a
        `timestamptz DEFAULT 'immediate'` would not be a slightly awkward value, it would not
        parse.
      enum: [immediate, next_boundary]
      default: immediate

    KeyScope:
      type: string
      description: |
        `runtime` for `/v1/*`, `admin` for `/v1/admin/*`. An `admin` key also works on the data
        plane.
      enum: [runtime, admin]

    KeyState:
      type: string
      description: |
        A key's lifecycle. Revocation is effective on the next request to the instance that served
        it, and within the propagation bound (NFR-D3) on every other.
      enum: [active, revoked, expired]

    TenantState:
      type: string
      description: |
        `suspended` preserves the balance exactly; resuming restores it (DR-032). `deleted` is a
        soft delete and is terminal.
      enum: [active, suspended, deleted]

    ArchiveState:
      type: string
      description: |
        A resource is archived rather than deleted, so audit and event history never dangles
        (DR-016).
      enum: [active, archived]

    FeatureKind:
      type: string
      description: |
        `metered` is counted in a unit, with an allowance per cycle. `boolean` is present or
        absent, with no counter: no balance, no limit, no bonus and no exhaustion (DR-050).
        `rolling` is counted in a unit against a limit over a sliding lookback window, with no
        calendar cycle (DR-052). A feature's kind is chosen when it is created and never changes.
      enum: [metered, boolean, rolling]

    RollingWindow:
      type: string
      description: |
        The lookback of a `rolling` entitlement (DR-052). A string, never a number of seconds, so
        a unit mistake cannot reach the service (Q-11). Each window is counted in 60 buckets, so
        its precision is one sixtieth of it: 5 s for `rolling_5m`, 12 h for `rolling_30d`.
      enum: [rolling_5m, rolling_15m, rolling_1h, rolling_6h, rolling_24h, rolling_7d, rolling_30d]

    EventSource:
      type: string
      description: Who caused the event.
      enum: [api, admin, system]

    EventType:
      type: string
      description: |
        The seven ledger event types. `delta` is signed and never zero, so an `amount: 0` consume
        records no event at all (DR-023).
      enum: [consumed, refunded, granted, set, plan_changed, cycle_rolled_over, force_rolled_over]

    # There is deliberately no shared `CycleWindow` schema, and the repetition of
    # `cycle_start`/`cycle_end` across MeteredResponse, CheckResponse, BalanceEntry and
    # UsageEvent is deliberate.
    #
    # The obvious "fix" is to factor the pair into one schema and reference it with `allOf`.
    # That silently breaks request/response strictness: in JSON Schema 2020-12 a subschema's
    # `additionalProperties: false` only sees the `properties` declared in *that* subschema,
    # so the shared window would reject every sibling field (MeteredResponse would fail its own
    # `balance`). The correct refactor needs `unevaluatedProperties: false` at the outer level
    # or a `discriminator`-style merge, both of which would put DoD item 3 at the mercy of
    # ogen support that has not been verified.
    #
    # Four inline copies of a nullable timestamp pair is a smaller cost than a generated
    # validator that stops rejecting undeclared fields. The invariant that `cycle_start` is null
    # exactly when `cycle_end` is null, being a `never` entitlement, lives once in
    # domain-rules.md (DR-002, DR-003) rather than being restated per schema.

    Metadata:
      type: object
      description: |
        Correlation only: at most 4 KiB, never indexed, never logged, and **never returned by any
        endpoint** (DR-043, NFR-T6). It is not a data store and it is not a place for PII.
      additionalProperties: true
      examples:
        correlation:
          value:
            model: claude-opus-5
            conv: c_9f3a

    ErrorCode:
      type: string
      description: |
        The only field to branch on. Stable, permanent, lower snake case. A code may be retired
        only in a major version, and only if no client could reasonably depend on it.

        The enum is the catalogue by reference, and a contract test asserts the two match, so the
        service cannot raise a code that is not in
        [error-catalog.md](../../docs/product/error-catalog.md).
      enum:
        - validation_failed
        - invalid_amount
        - invalid_window
        - invalid_timezone
        - missing_idempotency_key
        - unauthorized
        - api_key_invalid
        - insufficient_scope
        - feature_not_in_plan
        - feature_archived
        - tenant_suspended
        - tenant_not_found
        - feature_not_found
        - plan_not_found
        - api_key_not_found
        - payload_too_large
        - idempotency_key_reuse
        - plan_in_use
        - feature_in_use
        - feature_key_exists
        - tenant_exists
        - tenant_deleted
        - plan_key_exists
        - refund_exceeds_grant
        - grant_exceeds_ceiling
        - reset_not_supported
        - feature_not_metered
        - feature_not_anchored
        - feature_unit_immutable
        - resource_version_conflict
        - confirmation_required
        - quota_exceeded
        - rate_limited
        - service_unavailable
        - control_plane_unavailable
        - internal_error
        - not_implemented
        - webhook_not_found

    ErrorResponse:
      type: object
      description: |
        The one error shape, everywhere, and it is non-negotiable. No endpoint returns a bare
        `400` or a bare `500` without it.

        `additionalProperties: false` here is what makes a typo in an error field a visible
        defect rather than a silently dropped key.
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          description: |
            The error itself, nested under `error` so the envelope is extensible. `code` is the
            contract; `message` is not.
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: |
                Human-readable and may improve between releases. **Never parse it.** Branch on
                `code` and on `details`.
            request_id:
              $ref: '#/components/schemas/RequestId'
            retry_after_ms:
              type: integer
              format: int64
              minimum: 0
              description: |
                Present only when retrying is correct. On `quota_exceeded` it is **absent**,
                because the wait is a calendar duration in `details.cycle_end` and a small number
                here would invite a hammering loop.
            details:
              $ref: '#/components/schemas/ErrorDetails'

    ErrorDetails:
      type: object
      description: |
        Code-specific and additive across versions. Every code-specific field lives **here**, not
        beside `code`, which is what keeps the envelope one shape everywhere.

        Additive means a field may be added without a version bump. It does not mean a field's
        type or meaning may change, and a client must tolerate a field it does not know.
      additionalProperties: true
      examples:
        validation:
          summary: Aggregated field errors
          value:
            errors:
              - field: amount
                issue: must be an integer, got 4200.0

    MeteredRequest:
      type: object
      description: |
        The body of `consume`, `refund` and `check`. It is the same body on all three, because the
        three differ in what they do with it rather than in what they need.
      additionalProperties: false
      required: [feature_key, amount, tenant_external_id]
      properties:
        feature_key:
          allOf:
            - $ref: '#/components/schemas/FeatureKey'
          description: |
            A **single** key, never an array. One feature per call, by design: a bundle would have
            to attribute its cost across features, which breaks the per-feature event model and
            the idempotency fingerprint, and a partial bundle failure is a state the caller cannot
            reason about. A bundle is two calls ([Q-05](../../docs/product/assumptions-and-open-questions.md#2-open-questions)).
        amount:
          $ref: '#/components/schemas/Amount'
        tenant_external_id:
          allOf:
            - $ref: '#/components/schemas/ExternalId'
          description: The customer never handles an internal `tenant_id`.
        metadata:
          $ref: '#/components/schemas/Metadata'
        window:
          allOf:
            - $ref: '#/components/schemas/RollingWindow'
          description: |
            Omitted means the anchored cycle (ADR-0008). A `rolling` feature must name the window
            its plan entitlement configures, and any other feature must omit it: a window that is
            absent, different, unknown or sent to an anchored feature is `400 invalid_window`,
            because the two cadences are never silently mixed (DR-052).
      examples:
        metered:
          value:
            feature_key: llm.tokens.output
            amount: 4200
            tenant_external_id: acme-prod-01
            metadata:
              model: claude-opus-5
              conv: c_9f3a

    MeteredResponse:
      description: |
        One feature's numbers after a metered call, describing the cycle the call fell in. A replay
        returns the same body with `replayed: true`, because a retrying client must not be able to
        tell a replay from a second charge by its shape alone (DR-049).
      type: object
      additionalProperties: false
      required: [tenant_external_id, feature_key, kind, balance, limit, bonus, consumed, cycle_start, cycle_end, replayed]
      properties:
        tenant_external_id:
          $ref: '#/components/schemas/ExternalId'
        feature_key:
          $ref: '#/components/schemas/FeatureKey'
        kind:
          allOf:
            - $ref: '#/components/schemas/FeatureKind'
          description: |
            The feature's kind. For `boolean`, `balance`, `limit` and `bonus` are `null` and the
            cycle fields are `null`, because an inclusion has no counter and no cycle (DR-050).
            For `rolling`, `balance` is what remains in the window, `bonus` and the cycle fields
            are `null`, and `window` and `window_precision_seconds` are present (DR-052).
        balance:
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
          description: The remaining balance **after** the deduction. Null for a boolean entitlement.
        limit:
          oneOf:
            - $ref: '#/components/schemas/Limit'
            - type: 'null'
          description: The cycle allowance. Null for a boolean entitlement, which has no ceiling.
        bonus:
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
          description: Cycle-scoped granted quota. It does not survive the boundary (DR-020). Null for a boolean entitlement.
        consumed:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: |
            The amount the **original** call applied, returned unchanged on a replay because a
            replay reads the recorded state (DR-027). On `consume`, `balance` minus `consumed` is
            the balance before the original deduction. On `refund` the schema is shared, so
            `consumed` is the amount refunded and `balance` minus `consumed` is the balance before
            the refund.
        cycle_start:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        cycle_end:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        window:
          allOf:
            - $ref: '#/components/schemas/RollingWindow'
          description: Present only for a `rolling` feature, the window the numbers describe (DR-052).
        window_precision_seconds:
          type: integer
          format: int64
          minimum: 1
          description: |
            Present only for a `rolling` feature: the width of one bucket, which is the precision
            of the window sum. A unit counts for at least the window less this and at most the
            window (DR-052).
        replayed:
          type: boolean
          description: |
            Whether this response is a replay of a stored one. A client that needs to know
            whether **this call** moved anything reads this, rather than inferring it from
            arithmetic, and it can also read the `Idempotent-Replay` header.

    CheckResponse:
      type: object
      description: The answer to "would this be allowed", which is always a `200` when answerable.
      additionalProperties: false
      required: [allowed, kind, balance, limit, bonus, requested, cycle_end]
      properties:
        allowed:
          type: boolean
          description: |
            A denial is `allowed: false` at `200`, **not** a `429` (DR-024). A `429` from this
            route means the service is rate-limiting you. An included boolean entitlement is
            always `allowed: true` (DR-050).
        kind:
          allOf:
            - $ref: '#/components/schemas/FeatureKind'
          description: |
            The feature's kind. For `boolean`, `balance`, `limit`, `bonus` and `cycle_end` are
            `null`. For `rolling`, `bonus` and `cycle_end` are `null`, `balance` is what remains in
            the window, and `window` and `window_precision_seconds` are present (DR-052).
        balance:
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
          description: The balance now. Null for a boolean entitlement.
        limit:
          oneOf:
            - $ref: '#/components/schemas/Limit'
            - type: 'null'
          description: The cycle allowance. Null for a boolean entitlement.
        bonus:
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
          description: Cycle-scoped granted quota. Null for a boolean entitlement.
        requested:
          $ref: '#/components/schemas/Amount'
        cycle_end:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: When a currently-denied amount would become available. Null for a `rolling` feature, which has no cycle.
        window:
          allOf:
            - $ref: '#/components/schemas/RollingWindow'
          description: Present only for a `rolling` feature, the window the numbers describe (DR-052).
        window_precision_seconds:
          type: integer
          format: int64
          minimum: 1
          description: |
            Present only for a `rolling` feature: the width of one bucket, which is the precision
            of the window sum. A unit counts for at least the window less this and at most the
            window (DR-052).

    BalanceEntry:
      description: |
        One feature's balance for the current cycle. A feature the tenant's plan does not include is
        absent rather than zero, so a caller can tell an omission from an exhausted allowance.
      type: object
      additionalProperties: false
      required: [feature_key, kind, balance, limit, bonus, consumed, cycle_start, cycle_end]
      properties:
        feature_key:
          $ref: '#/components/schemas/FeatureKey'
        kind:
          allOf:
            - $ref: '#/components/schemas/FeatureKind'
          description: |
            The feature's kind. An included boolean entitlement is an entry whose `balance`,
            `limit`, `bonus`, `consumed`, `cycle_start` and `cycle_end` are all `null`: present,
            with no counter (DR-050). Its presence is the answer. A `rolling` entry has a
            `window`, a `window_precision_seconds`, a null `bonus` and null cycle fields (DR-052).
        balance:
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
          description: The balance now. Null for a boolean entitlement.
        limit:
          oneOf:
            - $ref: '#/components/schemas/Limit'
            - type: 'null'
          description: The cycle allowance. Null for a boolean entitlement.
        bonus:
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
          description: Cycle-scoped granted quota. Null for a boolean entitlement.
        consumed:
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
          description: |
            Net consumption in the stored cycle, derived as `limit + bonus - balance`. A refund
            lowers it and an administrative `set` shows through it. It is computed from the balance
            hash rather than read from the ledger, because this route never reads the control
            plane (DR-039). Null for a boolean entitlement, whose use is not counted. For a
            `rolling` feature it is the window sum, and `balance` is `limit` minus it.
        cycle_start:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        cycle_end:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        window:
          allOf:
            - $ref: '#/components/schemas/RollingWindow'
          description: Present only for a `rolling` feature, the window the numbers describe (DR-052).
        window_precision_seconds:
          type: integer
          format: int64
          minimum: 1
          description: |
            Present only for a `rolling` feature: the width of one bucket, which is the precision
            of the window sum. A unit counts for at least the window less this and at most the
            window (DR-052).
        cap:
          allOf:
            - $ref: '#/components/schemas/AllocationCap'
          description: |
            Present only for an allocation-cap feature (`allocation_cap: true`), and absent on
            every other entry (DR-054).

    AllocationCap:
      description: |
        What an allocation cap counts and how many it counts now (UC-10, DR-054). The count is the
        entry's `consumed`: creations less the refunds of deletions, with any administrative `set`
        showing through.
      type: object
      additionalProperties: false
      required: [resource, count]
      properties:
        resource:
          allOf:
            - $ref: '#/components/schemas/Unit'
          description: The resource type the cap counts, which is the feature's `unit`, such as `project` or `seat`.
        count:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: The number of that resource the tenant holds now.

    BalanceResponse:
      description: |
        Every feature's balance for one tenant, in one call. Paged by feature rather than by tenant,
        because the question is never about a tenant on its own.
      type: object
      additionalProperties: false
      required: [tenant_external_id, entries]
      properties:
        tenant_external_id:
          $ref: '#/components/schemas/ExternalId'
        entries:
          type: array
          description: |
            One entry, or the tenant's full set. The set is bounded by the plan's entitlement
            count (NFR-T5), so the unbounded case does not exist. An empty page is `[]`, never
            `null`.
          items:
            $ref: '#/components/schemas/BalanceEntry'

    Feature:
      description: |
        One feature in Quotacore's catalogue. A feature is the thing that is metered; a plan says how
        much of it a tenant gets, and a tenant is assigned to exactly one plan (UC-05).
      type: object
      additionalProperties: false
      required: [id, feature_key, name, unit, kind, allocation_cap, description, state, version, created_at, updated_at, archived_at]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Internal. The admin routes address a feature by `feature_key`, never by this id, which
            exists for the audit log's `subject_id`.
        feature_key:
          allOf:
            - $ref: '#/components/schemas/FeatureKey'
          description: Immutable once created (INV-F3).
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The operator's display name. Cosmetic, and the only mutable field but `description`.
        unit:
          allOf:
            - $ref: '#/components/schemas/Unit'
          description: |
            Immutable once the feature is referenced by an assignment or an event. Reinterpreting
            historical amounts is not allowed, and that is what `feature_unit_immutable` is for
            (INV-F2).
        kind:
          $ref: '#/components/schemas/FeatureKind'
        allocation_cap:
          type: boolean
          description: |
            True for a feature that counts entities rather than events, such as seats or projects
            (UC-10). Fixed at creation. `GET /v1/balance` reports its resource and current count
            in `cap` (DR-054).
        description:
          type: string
          maxLength: 2000
          description: Free text for an operator reading a plan. Empty when there is nothing to say.
        state:
          $ref: '#/components/schemas/ArchiveState'
        version:
          $ref: '#/components/schemas/Version'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        archived_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: Null unless `state` is `archived`.

    FeatureCreate:
      description: |
        Create a feature. The catalogue is small and edited deliberately, because a feature key whose
        meaning later changes is a change to history (INV-F2, INV-F3).
      type: object
      additionalProperties: false
      required: [feature_key, name, unit]
      properties:
        feature_key:
          allOf:
            - $ref: '#/components/schemas/FeatureKey'
          description: Immutable. A duplicate is `409 feature_key_exists`.
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The operator's display name for the new feature.
        unit:
          allOf:
            - $ref: '#/components/schemas/Unit'
          description: Immutable once referenced, and documented on the feature rather than inferred.
        description:
          type: string
          maxLength: 2000
          description: Optional free text. Absent and `''` are the same thing, which is why it defaults to `''`.
          default: ''
        kind:
          allOf:
            - $ref: '#/components/schemas/FeatureKind'
          description: |
            Optional, `metered` by default. Fixed at creation: no route changes it, so a boolean
            feature never has a metered assignment to conflict with (F-5, DR-050).
          default: metered
        allocation_cap:
          type: boolean
          description: |
            Optional, false by default, and fixed at creation. True marks a metered feature that
            counts entities (UC-10): its plan entitlements must have `reset_interval: never`, and
            `GET /v1/balance` reports its `cap` (DR-054). True on a `boolean` or `rolling` feature
            is `400 validation_failed` naming this field.
          default: false

    FeatureUpdate:
      type: object
      description: |
        A rename, or a unit correction. `feature_key` is absent by design: it is immutable always, and
        offering an immutable field and then refusing it is a worse API than not offering it. `unit`
        is offered because it is mutable until the feature is referenced (INV-F2).
      additionalProperties: false
      required: [version]
      properties:
        version:
          allOf:
            - $ref: '#/components/schemas/Version'
          description: |
            Required. The optimistic-concurrency token from the `GET` that preceded this call. A
            mismatch is `409 resource_version_conflict` with the current version in `details`.
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The new display name, replacing the current one.
        description:
          type: string
          maxLength: 2000
          description: Replaces the current free text. `''` clears it, so clearing is an explicit act.
        unit:
          allOf:
            - $ref: '#/components/schemas/Unit'
          description: |
            A new unit, accepted only while no plan entitlement, override or usage event references
            the feature. Otherwise `409 feature_unit_immutable` (INV-F2).

    FeatureList:
      description: |
        A page of the feature catalogue, for a picker or a review. Features are created and archived,
        never deleted, so a historical event always resolves to something (UC-05).
      type: object
      additionalProperties: false
      required: [features]
      properties:
        features:
          type: array
          description: The page of features. An empty page is `[]`, never `null`.
          items:
            $ref: '#/components/schemas/Feature'
        next_cursor:
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'
          description: Null on the last page. An empty page is an empty array, never `null`.

    PlanEntitlement:
      type: object
      description: |
        One feature's allowance in a plan. `limit` and `reset_interval` are both required and both
        nullable, by the convention in api-conventions.md section 7.4: a metered feature takes a
        number and an interval, and a boolean feature takes `null` for both, because an inclusion
        has no ceiling and no cycle (UC-02, DR-050). A number for either on a boolean feature, or a
        `null` on a metered one, is `400 validation_failed` naming the field, rather than being
        ignored. A rolling feature takes a `limit`, a `null` `reset_interval` and a `window`, and
        `window` is absent or `null` for any other kind (DR-052).
      additionalProperties: false
      required: [feature_key, limit, reset_interval]
      properties:
        feature_key:
          $ref: '#/components/schemas/FeatureKey'
        limit:
          oneOf:
            - $ref: '#/components/schemas/Limit'
            - type: 'null'
          description: The cycle allowance of a metered feature, or the window allowance of a rolling one; `null` for a boolean one.
        reset_interval:
          oneOf:
            - $ref: '#/components/schemas/ResetInterval'
            - type: 'null'
          description: The cadence of a metered feature; `null` for a boolean or rolling one.
        window:
          oneOf:
            - $ref: '#/components/schemas/RollingWindow'
            - type: 'null'
          description: The lookback of a rolling feature; absent or `null` for any other kind (DR-052).

    Plan:
      description: |
        One plan: the offer a tenant is assigned to. A plan is a bounded set of entitlements and
        nothing else â€” no tenant, no key and no balance (DR-011).
      type: object
      additionalProperties: false
      required: [id, plan_key, name, description, state, version, entitlements, created_at, updated_at, archived_at]
      properties:
        id:
          type: string
          format: uuid
          description: Internal, and what `/v1/admin/plans/{id}` and `/v1/admin/plans/{id}/impact` take.
        plan_key:
          $ref: '#/components/schemas/PlanKey'
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The operator's display name for the plan.
        description:
          type: string
          maxLength: 2000
          description: Free text for an operator reading the plan. Empty when there is nothing to say.
        state:
          $ref: '#/components/schemas/ArchiveState'
        version:
          $ref: '#/components/schemas/Version'
        entitlements:
          type: array
          description: |
            At most 100. The bound is a documented validation limit rather than a struct size, so
            a larger plan is a `400 validation_failed` rather than a slow request (NFR-T5).
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/PlanEntitlement'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        archived_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    PlanCreate:
      description: |
        Create a plan, entitlements included. A plan is created whole, because a plan with no
        entitlements is not a plan (UC-11).
      type: object
      additionalProperties: false
      required: [plan_key, name, entitlements]
      properties:
        plan_key:
          allOf:
            - $ref: '#/components/schemas/PlanKey'
          description: A duplicate is `409 plan_key_exists`.
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The operator's display name for the new plan.
        description:
          type: string
          maxLength: 2000
          description: Optional free text. Absent and `''` are the same thing, which is why it defaults to `''`.
          default: ''
        entitlements:
          type: array
          description: |
            The whole offer, 1 to 100 features. The upper bound is a documented validation limit
            rather than a struct size, so a larger plan is a `400 validation_failed` rather than a
            slow request (NFR-T5).
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/PlanEntitlement'

    PlanUpdate:
      type: object
      description: |
        An edit to a plan's entitlements. It applies to new assignments immediately; an existing
        tenant takes a new limit at its next boundary and a new interval or an added feature at its
        next re-anchor, and keeps a removed feature until the end of the window the edit landed
        in. It does not touch an open balance and it does not move a boundary (DR-014).
      additionalProperties: false
      required: [version]
      properties:
        version:
          allOf:
            - $ref: '#/components/schemas/Version'
          description: |
            Required. The plan is an offer that governs a customer's money, so last-write-wins is
            not acceptable: a mismatch is `409 resource_version_conflict` (FS-12).
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The new display name, replacing the current one.
        description:
          type: string
          maxLength: 2000
          description: Replaces the current free text. `''` clears it, so clearing is an explicit act.
        entitlements:
          type: array
          description: |
            **Replaces the whole set.** A partial update of a bounded set is an ambiguity, and a
            plan is edited as one offer.
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/PlanEntitlement'

    PlanApplyRequest:
      description: |
        Re-anchor every tenant assigned to a plan. It is the only control-plane write that touches
        tenants it was not addressed to, and the reason a reason is required is that a decision with a
        blast radius is a decision worth reading later (DR-014).
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: |
            Required and audited. Re-anchoring every assigned tenant is a decision with a blast
            radius, and a decision with a blast radius is one whose reason is worth having later.
        confirmation_token:
          type: string
          description: |
            Present only when re-issuing after `409 confirmation_required`. Single-use, bound to
            the plan, the `resource_version` and the `reason` it was issued against, and expiring on
            `QUOTACORE_CONFIRMATION_TTL`, because an abandoned token must not accumulate in a
            store that cannot evict (DR-048).
          pattern: '^cnf_[0-9A-HJKMNP-TV-Z]{26}$'
          examples:
            token:
              value: cnf_01J8Z6M2QK9V3X7B4C0N5TDEFA

    PlanApplied:
      description: |
        The outcome of a completed apply, so a caller can record what happened without re-reading the
        plan and hoping it has not been edited since (UC-18).
      type: object
      additionalProperties: false
      required: [plan_key, affected_tenants, applied_at, version]
      properties:
        plan_key:
          $ref: '#/components/schemas/PlanKey'
        affected_tenants:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many tenants were re-anchored, as committed. It is at most the `affected_tenants`
            the operator was shown in the confirmation: a token is not honoured once the plan's
            count has grown past it.
        applied_at:
          $ref: '#/components/schemas/Timestamp'
        version:
          allOf:
            - $ref: '#/components/schemas/Version'
          description: The plan's version after the apply.

    PlanImpact:
      type: object
      description: |
        What an apply-now of the plan as saved would affect, read-only. Nothing is re-anchored, no
        audit row records a mutation and no token is issued (UC-19).
      additionalProperties: false
      required: [plan_key, affected_tenants, earliest_cycle_end, exceeds_confirmation_threshold]
      properties:
        plan_key:
          $ref: '#/components/schemas/PlanKey'
        affected_tenants:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many non-deleted tenants are on the plan, suspended ones included, which is the
            number `exceeds_confirmation_threshold` compares against the configured threshold.
        earliest_cycle_end:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: |
            The earliest `cycle_end` among affected tenants' features that reset, in that tenant's
            zone, or null when there is none. It is the same value `confirmation_required`
            reports, so the common case is a quiet read rather than a `409`.
        exceeds_confirmation_threshold:
          type: boolean
          description: |
            Whether `affected_tenants` is above `QUOTACORE_PLAN_APPLY_CONFIRM_THRESHOLD`. The
            operator can tell whether to expect a confirmation without provoking one.

    PlanList:
      description: |
        A page of plans, for a picker or a review.
      type: object
      additionalProperties: false
      required: [plans]
      properties:
        plans:
          type: array
          description: The page of plans. An empty page is `[]`, never `null`.
          items:
            $ref: '#/components/schemas/Plan'
        next_cursor:
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'

    TenantMetadata:
      type: object
      description: |
        A small JSON object on the tenant, explicitly not PII, not indexed by content and excluded
        from logs (DR-043, NFR-O6). Distinct from a request body's `metadata`, which is never
        returned.
      additionalProperties: true

    Tenant:
      description: |
        One tenant: the customer Quotacore meters. `external_id` is the customer's identifier, and
        every other field is either derived from it or operational bookkeeping (DR-001).
      type: object
      additionalProperties: false
      required: [id, external_id, display_name, plan_key, timezone, state, anchor_at, version, created_at, updated_at, deleted_at, metadata]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Internal.             The customer uses `external_id`; this exists for the audit log's
            `subject_id`.
        external_id:
          $ref: '#/components/schemas/ExternalId'
        display_name:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            A label for an operator reading a tenant list. Not an identity and not a lookup key:
            two tenants may share one, so the uniqueness rule is on `external_id` alone.
        plan_key:
          $ref: '#/components/schemas/PlanKey'
        timezone:
          type: string
          description: |
            An IANA name. The tenant's cycle boundaries are computed in this zone, so a wrong zone
            is a wrong bill. Abbreviations are `400 invalid_timezone`; a timezone is a set of rules
            and an abbreviation is not one (ADR-0007).
          pattern: '^(?:UTC|[A-Za-z][A-Za-z0-9_+-]*(?:/[A-Za-z0-9_+-]+)+)$'
          examples:
            berlin:
              value: Europe/Berlin
        state:
          $ref: '#/components/schemas/TenantState'
        anchor_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: |
            The tenant's **only** per-tenant cycle state (DR-002). There is deliberately no stored
            current window: a stored window that could disagree with the anchor is exactly the
            defect the pure-function design removes, and boundaries are computed from the anchor
            in the application, in UTC, with the zone applied to the arithmetic (ADR-0003).
        version:
          $ref: '#/components/schemas/Version'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        deleted_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: |
            Set by a soft delete, which is **not retroactive**: events and audit rows stay
            queryable, which is what makes a dispute answerable after a churn event (T-15). There
            is no undelete.
        metadata:
          $ref: '#/components/schemas/TenantMetadata'

    TenantCreate:
      description: |
        Provision a tenant on a plan. The cycle starts now, at the anchor, and the allowance is
        materialised immediately rather than on first use, so a missing balance is a defect and not a
        lazy read (DR-002, DR-045).
      type: object
      additionalProperties: false
      required: [external_id, display_name, plan_key]
      properties:
        external_id:
          allOf:
            - $ref: '#/components/schemas/ExternalId'
          description: |
            Your identifier for this tenant. A duplicate is `409 tenant_exists`, deliberately not
            idempotent, so a provisioning bug surfaces instead of being hidden.
        display_name:
          type: string
          minLength: 1
          maxLength: 200
          description: An operator-facing label. Not unique, and never a lookup key.
        plan_key:
          $ref: '#/components/schemas/PlanKey'
        timezone:
          type: string
          description: |
            An IANA name; defaults to `UTC`. The zone the tenant's cycle boundaries are computed
            in.
          pattern: '^(?:UTC|[A-Za-z][A-Za-z0-9_+-]*(?:/[A-Za-z0-9_+-]+)+)$'
          default: UTC
        metadata:
          $ref: '#/components/schemas/TenantMetadata'

    TenantUpdate:
      type: object
      description: |
        A change to a tenant. **Changing `plan_key` is a hard reset**: the new limits apply
        immediately, the anchor is set to now, and the previous balance is discarded rather than
        prorated, recorded as a `plan_changed` event so the discard is visible (DR-013).

        Proration is deferred deliberately. Prorating a limit is a claim about time the customer
        did not buy; the balance was for the cycle that just ended.
      additionalProperties: false
      required: [version]
      properties:
        version:
          allOf:
            - $ref: '#/components/schemas/Version'
          description: |
            Required. The optimistic-concurrency token. A mismatch is
            `409 resource_version_conflict`.
        display_name:
          type: string
          minLength: 1
          maxLength: 200
          description: The new operator-facing label, replacing the current one.
        plan_key:
          allOf:
            - $ref: '#/components/schemas/PlanKey'
          description: A change here starts a fresh cycle and discards the open balance.
        timezone:
          type: string
          pattern: '^(?:UTC|[A-Za-z][A-Za-z0-9_+-]*(?:/[A-Za-z0-9_+-]+)+)$'
          description: |
            An IANA name, as on `Tenant.timezone`, and an abbreviation is `400
            invalid_timezone` for the same reason. The zone boundaries are recomputed from the
            unchanged anchor, so this moves future boundaries and leaves past ones alone.
        metadata:
          $ref: '#/components/schemas/TenantMetadata'

    TenantList:
      description: |
        A page of tenants, for an operator. Admin-scoped, because it enumerates other customers.
      type: object
      additionalProperties: false
      required: [tenants]
      properties:
        tenants:
          type: array
          description: The page of tenants. An empty page is `[]`, never `null`.
          items:
            $ref: '#/components/schemas/Tenant'
        next_cursor:
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'
          description: |
            Null on the last page. Totals are deliberately not returned: a count over a large
            tenant table is a slow query pretending to be metadata.

    Cursor:
      type: string
      description: |
        An opaque, signed pagination cursor. Never parse it and never construct one. A tampered
        cursor is `400 validation_failed`, not a silent full scan.
      minLength: 1
      maxLength: 512
      examples:
        cursor:
          value: eyJjcmVhdGVkX2F0IjoiMjAyNi0wOS0yOVQwMjoxMToySisic29ydCI6ImRlc2MifQ

    ReasonRequest:
      type: object
      description: A state-changing admin call with a mandatory reason, audited with before and after.
      additionalProperties: false
      required: [version, reason]
      properties:
        version:
          allOf:
            - $ref: '#/components/schemas/Version'
          description: The optimistic-concurrency token. A mismatch is `409 resource_version_conflict`.
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: |
            Required. Every administrative mutation writes an audit row in the same transaction as
            the mutation (NFR-D4), and a reason is the part of that row a human reads later.

    ArchiveRequest:
      description: |
        Archive a plan or a feature. Archiving is not deletion: the record keeps its history and stops
        being assignable (UC-13). v0.1 has no unarchive route, so archiving is one-way here, and
        archiving a record that is already archived is a `200` that changes nothing and writes no
        audit row.
      type: object
      additionalProperties: false
      required: [version, reason]
      properties:
        version:
          allOf:
            - $ref: '#/components/schemas/Version'
          description: The optimistic-concurrency token.
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: |
            Required and audited. Archiving hides a plan or feature from new assignments, so the
            reason is what an operator reads to know whether it was deliberate.

    DeleteRequest:
      description: |
        Delete a tenant, a plan or a feature, with the reason the audit row records. A tenant is
        soft-deleted: deletion is terminal for the tenant, so the open balance is not re-granted and
        the ledger is kept, because a deleted tenant still has events (UC-14). A plan or a feature is
        hard-deleted, and only while nothing references it (P-6, F-6); otherwise the answer is
        `409 plan_in_use` or `409 feature_in_use`, and archiving is the remedy.
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: |
            Required and audited. Deletion is terminal, so the reason is the only record of why it
            happened.

    GrantRequest:
      type: object
      description: |
        Add cycle-scoped bonus quota. A grant does not survive the boundary: a bonus is a gesture
        and a limit is a contract (DR-019, DR-020).
      additionalProperties: false
      required: [feature_key, amount, reason]
      properties:
        feature_key:
          $ref: '#/components/schemas/FeatureKey'
        amount:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: |
            A grant only adds, so it is never negative. A grant on a `never` entitlement
            increases the balance with no ceiling tied to a cycle and no expiry.
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: Required, and audited. Goodwill is a decision, not a correction.

    SetRequest:
      type: object
      description: |
        Set a balance to an exact value. The blunt instrument, and the right one when a migration
        produced a number that is known to be wrong.
      additionalProperties: false
      required: [feature_key, value, reason]
      properties:
        feature_key:
          $ref: '#/components/schemas/FeatureKey'
        value:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: The balance after this call.
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: |
            Required and audited. Overwriting a balance destroys the previous figure, so the reason
            is the only record of what it was replaced by.

    ForceRolloverRequest:
      type: object
      description: |
        Roll one feature's cycle over now, applying the next cycle's allowance immediately. It is
        audited and recorded as a `force_rolled_over` event.
      additionalProperties: false
      required: [feature_key, reason]
      properties:
        feature_key:
          $ref: '#/components/schemas/FeatureKey'
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: |
            Required and audited. Rolling a cycle over early gives the tenant its next allowance
            now, so the reason is the record of who decided to and why.

    OverrideUpsert:
      type: object
      description: |
        Set or replace a per-feature override. An override is a **contract term** and outranks the
        plan: it survives later plan edits, because a plan is an offer and an override is what one
        customer signed for (DR-011).

        Clearing an override is `DELETE /v1/admin/tenants/{id}/overrides/{feature_key}`, not this
        route, because the storage cannot represent an override that sets nothing.

        **`limit_value` and `interval` are both required and both nullable.** UC-13 says "a limit,
        a reset interval, or both", and a required-but-nullable field is how "this aspect is not
        overridden" is stated without ambiguity. Requiring the key is deliberate: absence would
        mean two things, that the aspect is inherited and that the operator forgot it, and a
        quota system should not have a wire format with those two readings.

        **At least one of the two must be non-null, and this schema does not enforce that.** It is
        the one constraint in the contract that lives in the data store, as
        `tenant_overrides_not_empty`, and a request that sends both null is
        `400 validation_failed`. The reason is recorded here rather than papered over: expressing
        it in JSON Schema needs an `anyOf` over object branches, and the generator
        (ogen 1.24.0) cannot generate that, failing with "complex anyOf is not implemented yet".
        Silently dropping the constraint from the document to make the generator happy would
        leave a reader believing the wire format guarantees something it does not.

        The rule is normative in api-conventions.md section 7.4, which states the
        presence-and-null convention and the division of labour between the schema and the store.
      additionalProperties: false
      required: [feature_key, limit_value, interval]
      properties:
        feature_key:
          $ref: '#/components/schemas/FeatureKey'
        limit_value:
          oneOf:
            - $ref: '#/components/schemas/Limit'
            - type: 'null'
          description: |
            Null means "inherit the limit from the plan for this aspect". A non-null value may
            exceed the plan's limit: that is the mechanism for custom limits for an enterprise
            customer (DR-015).
        interval:
          oneOf:
            - $ref: '#/components/schemas/ResetInterval'
            - type: 'null'
          description: Null means "inherit the cadence from the plan".
        apply_at:
          allOf:
            - $ref: '#/components/schemas/OverrideApplyAt'
          description: |
            `immediate` by default. A mode, not a timestamp; the instant an override takes effect
            is always the tenant's next boundary, computed rather than stored.
        version:
          allOf:
            - $ref: '#/components/schemas/Version'
          description: |
            Optional expected version for the existing override. Omitted means "create or replace
            without a concurrency check", which is appropriate when a single operator is the only
            writer.
      examples:
        limit:
          summary: Ten times the plan limit, from the next boundary
          value:
            feature_key: llm.tokens.output
            limit_value: 10000000
            interval: null
            apply_at: next_boundary
        interval:
          summary: Custom cadence, limit inherited from the plan
          value:
            feature_key: api.requests
            limit_value: null
            interval: weekly
            apply_at: immediate
        both:
          summary: A limit and a cadence, neither inherited
          value:
            feature_key: api.requests
            limit_value: 5000
            interval: weekly
            apply_at: immediate

    OverrideClearRequest:
      type: object
      description: |
        The body of the override-clearing `DELETE`.

        `apply_at` is in the body rather than a query parameter because it changes **when** money
        is owed, and a `DELETE` that silently meant "now" would be a surprise in a billing system.
      additionalProperties: false
      required: [apply_at]
      properties:
        apply_at:
          $ref: '#/components/schemas/OverrideApplyAt'
      examples:
        clear:
          summary: Restore the plan value from the next boundary
          value:
            apply_at: next_boundary

    Override:
      description: |
        One per-feature override on one tenant. An override is a contract term and outranks the plan,
        which is why it is modelled separately rather than expressed as a plan edit (DR-011).
      type: object
      additionalProperties: false
      required: [id, feature_key, limit_value, interval, apply_at, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Internal. An override is addressed by tenant and `feature_key` rather than by this id,
            so there is at most one per pair.
        feature_key:
          $ref: '#/components/schemas/FeatureKey'
        limit_value:
          oneOf:
            - $ref: '#/components/schemas/Limit'
            - type: 'null'
          description: Null when the limit is inherited from the plan.
        interval:
          oneOf:
            - $ref: '#/components/schemas/ResetInterval'
            - type: 'null'
          description: Null when the cadence is inherited from the plan.
        apply_at:
          $ref: '#/components/schemas/OverrideApplyAt'
        version:
          $ref: '#/components/schemas/Version'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    UsageEvent:
      type: object
      description: |
        One ledger row. The ledger is append-only (INV-U2), reconstructed rather than trusted, and
        delivered downstream best effort and at-least-once, so `event_id` deduplication at the
        consumer is part of the contract rather than an oversight (ADR-0016).
      additionalProperties: false
      required: [id, tenant_external_id, feature_key, cycle_index, delta, balance_after, source, event_type, request_id, idempotency_key, cycle_start, cycle_end, occurred_at]
      properties:
        id:
          type: string
          format: uuid
          description: The `event_id` a downstream consumer deduplicates on.
        tenant_external_id:
          $ref: '#/components/schemas/ExternalId'
        feature_key:
          $ref: '#/components/schemas/FeatureKey'
        cycle_index:
          type: integer
          format: int64
          minimum: 0
          description: |
            Which cycle this was, monotonically increasing. A memo for reconciliation and
            pagination, **not** a second authority: the window itself is recomputed from the
            tenant's anchor, and a disagreement here is a reconciliation finding rather than a
            truth.
        delta:
          type: integer
          format: int64
          description: |
            Signed and **never zero** (a database constraint), so an `amount: 0` consume records no
            event at all. Negative consumes, positive refunds, grants, sets and rollovers.
          minimum: -9007199254740991
          maximum: 9007199254740991
          examples:
            consumed:
              summary: A consumption
              value: -4200
            rolled:
              summary: A rollover
              value: 1000000
        balance_after:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: |
            Stored so history is readable without replaying, and so the reconciliation identity of
            DR-042 is directly checkable: the opening allowance plus the sum of the deltas equals
            this.
        source:
          $ref: '#/components/schemas/EventSource'
        event_type:
          $ref: '#/components/schemas/EventType'
        request_id:
          oneOf:
            - $ref: '#/components/schemas/RequestId'
            - type: 'null'
          description: |
            The request that caused the event. A `system` event, such as a rollover by the reset
            worker, carries the request id the job minted for its run, so every event joins to a log
            line (NFR-S10). The column is `NOT NULL` (data-model.md §2.7); `null` is allowed by the
            schema and is not produced.
        idempotency_key:
          oneOf:
            - $ref: '#/components/schemas/IdempotencyKey'
            - type: 'null'
          description: |
            The customer's key, on `consumed` and `refunded`. Filtering by it is how a disputed
            charge is resolved: the recorded outcome shows whether it was applied once or twice
            (UC-16). On a duplicate that reconciliation reversed, and on the `system` refund that
            reversed it, this is the customer's key the pair reconciles (DR-049, amended
            2026-10-20).
        cycle_start:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: |
            The start of the event's cycle, recomputed from the tenant's current anchor, zone and
            interval. Null for an event older than the current anchor, because a window from before
            a re-anchor cannot be recomputed from the anchor that replaced it.
        cycle_end:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: |
            The end of the event's cycle, on the same terms as `cycle_start`, and also null for a
            `never` entitlement (INV-C6).
        occurred_at:
          $ref: '#/components/schemas/Timestamp'

    UsageEventList:
      description: |
        A page of the ledger, newest first, for reconciliation and for settling a disputed charge
        (UC-16).
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          description: Newest first, with a stable tiebreaker. An empty page is `[]`, never `null`.
          items:
            $ref: '#/components/schemas/UsageEvent'
        next_cursor:
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'

    AuditEntry:
      type: object
      description: |
        One administrative mutation, written in the same transaction as the mutation (NFR-D4). An
        audit log written best effort is a log, not an audit trail.
      additionalProperties: false
      required: [id, actor, actor_key_id, action, subject_type, subject_id, before, after, reason, request_id, occurred_at]
      properties:
        id:
          type: string
          format: uuid
          description: The audit row's own identifier, for citing a row rather than for looking one up by resource.
        actor:
          type: string
          description: |
            `bootstrap`, `cli:<host>`, or a key's name. A key's name rather than its secret, so an
            audit record can be shown to someone without handing them a credential (DR-043).
          examples:
            key:
              value: acme-prod-deploy
        actor_key_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
          description: Null for the bootstrap actor and for CLI calls, which have no key.
        action:
          type: string
          description: A dotted action name.
          pattern: '^[a-z_]+\.[a-z_]+$'
          examples:
            apply:
              value: plan.apply_now
        subject_type:
          type: string
          enum: [tenant, plan, feature, api_key, system, webhook]
          description: |
            Which kind of resource changed, so a log reader can filter by it. `system` is a note
            about the installation itself, such as the truncation an operator records after a
            Postgres restore with `quotacore audit note`; its `subject_id` is null.
        subject_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
          description: |
            The resource's internal id, or null when the mutation has no single subject — a plan
            `apply-now` touches every assigned tenant, so the tenants are not recorded here one by
            one.
        before:
          description: The resource before the change, or null when it was created.
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        after:
          description: The resource after the change, or null when it was deleted.
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        reason:
          description: |
            The reason the caller gave, for the mutations that require one (archive, delete, suspend,
            resume), and null for the rest.
          oneOf:
            - type: string
            - type: 'null'
        request_id:
          $ref: '#/components/schemas/RequestId'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'

    AuditEntryList:
      description: |
        A page of the audit log, newest first. Append-only, and the reason a mutation cannot be
        quietly undone after the fact (NFR-D4).
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          description: The page of entries, newest first. An empty page is `[]`, never `null`.
          items:
            $ref: '#/components/schemas/AuditEntry'
        next_cursor:
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'

    WebhookSubscriptionType:
      type: string
      enum: [threshold_crossing, absolute_threshold, plan_change, cycle_rollover]
      description: |
        What a subscription is told about (DR-055). `threshold_crossing` is a fraction of the
        allowance used and `absolute_threshold` a remaining balance, so the two are never confused:
        80% of a limit of 1,000 and 200 left fire together today and apart after a plan change.
        `plan_change` matches the ledger's `plan_changed`; `cycle_rollover` matches
        `cycle_rolled_over` and `force_rolled_over`.

    WebhookSubscription:
      type: object
      description: |
        One entry of a subscription set. A threshold names a metered feature with an anchored
        cadence and a `value`; `plan_change` and `cycle_rollover` take neither, and sending one is
        `400 validation_failed` naming the entry. Whether the feature and the value fit the type is
        checked by the service, because JSON Schema cannot tie two fields to a third's value.
      additionalProperties: false
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/WebhookSubscriptionType'
        feature_key:
          $ref: '#/components/schemas/FeatureKey'
        value:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: |
            For `threshold_crossing`, the percentage of the limit used, 1 to 100. For
            `absolute_threshold`, the remaining balance, 0 to 2^53 − 1.

    WebhookPut:
      type: object
      description: |
        A tenant's webhook, whole. A `PUT` replaces both fields; the secret is not a field, because
        the service derives it (Q-40).
      additionalProperties: false
      required: [url, subscriptions]
      properties:
        url:
          type: string
          minLength: 9
          maxLength: 2048
          description: |
            An absolute `https` URL with a host, no user information and no fragment. Which
            addresses it may resolve to is v0.3's egress policy (IP-23).
        subscriptions:
          type: array
          minItems: 1
          maxItems: 20
          description: |
            1 to 20 entries, no two the same. A delivery is one per ledger event, listing every
            threshold that event crossed, so subscribing to two thresholds never splits one event
            into two notifications with one `event_id` (INV-W1).
          items:
            $ref: '#/components/schemas/WebhookSubscription'

    Webhook:
      type: object
      description: A tenant's webhook as stored. The secret is never present (Q-40).
      additionalProperties: false
      required: [tenant_external_id, url, subscriptions, secret_generation, created_at, updated_at]
      properties:
        tenant_external_id:
          $ref: '#/components/schemas/ExternalId'
        url:
          type: string
          description: The endpoint deliveries are posted to.
        subscriptions:
          type: array
          description: The subscription set, in the order it was sent.
          items:
            $ref: '#/components/schemas/WebhookSubscription'
        secret_generation:
          type: integer
          format: int64
          minimum: 1
          description: |
            Which secret signs deliveries: 1 at create, and one more on each rotation. It names the
            secret without disclosing it, so an audit row can say a rotation happened.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    WebhookWithSecret:
      type: object
      description: |
        The webhook and its signing secret, returned by a create and a rotation and by nothing
        else. The secret is derived from the operator's signing key, the webhook and its
        generation, and is stored nowhere (Q-40, NFR-S1).
      additionalProperties: false
      required: [tenant_external_id, url, subscriptions, secret_generation, created_at, updated_at, secret]
      properties:
        tenant_external_id:
          $ref: '#/components/schemas/ExternalId'
        url:
          type: string
          description: The endpoint deliveries are posted to.
        subscriptions:
          type: array
          description: The subscription set, in the order it was sent.
          items:
            $ref: '#/components/schemas/WebhookSubscription'
        secret_generation:
          type: integer
          format: int64
          minimum: 1
          description: The generation this secret is.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        secret:
          type: string
          pattern: '^qcwh_[A-Za-z0-9_-]{43}$'
          description: |
            The HMAC-SHA256 key, used as these exact bytes, that signs every delivery
            ([webhooks.md](../../docs/architecture/webhooks.md)). Shown once.

    WebhookCrossing:
      type: object
      description: One threshold a ledger event crossed, as the subscription named it.
      additionalProperties: false
      required: [type, value]
      properties:
        type:
          type: string
          enum: [threshold_crossing, absolute_threshold]
          description: Which kind of threshold, so a percentage is never read as a balance.
        value:
          type: integer
          format: int64
          description: The subscription's value, a percentage used or a remaining balance.

    WebhookPayload:
      type: object
      description: |
        The body of a delivery (v0.3). One per ledger event, so `event_id` is the ledger event's
        own and is also the `Quotacore-Delivery` header (INV-W1). The signature covers this body
        byte for byte; [webhooks.md](../../docs/architecture/webhooks.md) shows how to verify it.
      additionalProperties: false
      required: [event_id, event_type, occurred_at, tenant_external_id, feature_key, delta, balance, crossings]
      properties:
        event_id:
          type: string
          format: uuid
          description: The ledger event's identifier. Deduplicate on it.
        event_type:
          $ref: '#/components/schemas/EventType'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        tenant_external_id:
          $ref: '#/components/schemas/ExternalId'
        feature_key:
          $ref: '#/components/schemas/FeatureKey'
        delta:
          type: integer
          format: int64
          description: The signed change the event made to the balance.
        balance:
          type: integer
          format: int64
          description: The balance after the event.
        crossings:
          type: array
          description: |
            Every subscribed threshold the event crossed, possibly none when the event is a plan
            change or a rollover the tenant subscribed to.
          items:
            $ref: '#/components/schemas/WebhookCrossing'

    Key:
      type: object
      description: |
        Key metadata. The secret is never present here and no route will return it (INV-K3).
      additionalProperties: false
      required: [id, name, prefix, scope, state, tenant_external_id, created_at, expires_at, last_used_at, revoked_at]
      properties:
        id:
          type: string
          format: uuid
          description: Internal, and what `/v1/admin/keys/{id}` takes.
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Unique. A duplicate name is `400 validation_failed` naming the field.
        prefix:
          type: string
          description: |
            The public, unique part of the key. It appears in this list, in the audit log and in
            logs **in place of the key**, which is how a key leaked in a support ticket is traced
            to the key that leaked (DR-043, K-1).
          pattern: '^[0-9a-f]{8,64}$'
        scope:
          $ref: '#/components/schemas/KeyScope'
        state:
          $ref: '#/components/schemas/KeyState'
        tenant_external_id:
          oneOf:
            - $ref: '#/components/schemas/ExternalId'
            - type: 'null'
          description: |
            The one tenant a bound runtime key can address, or null for a key that reaches every
            tenant (DR-053). Fixed at issue.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: |
            Optional at issue time, enforced on every request. A key past this is
            `401 api_key_invalid`.
        last_used_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        revoked_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: |
            Revocation takes effect on the next request to the instance that served it, and within
            the propagation bound (NFR-D3) on every other instance (UC-15, K-2).

    KeyCreate:
      description: |
        Issue an API key. The plaintext is returned once, on this route and nowhere else
        (ADR-0012).
      type: object
      additionalProperties: false
      required: [name, scope]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            Unique and operator-chosen. It is the `actor` on every audit row this key produces, so
            it should say what the key is for rather than who typed it.
        scope:
          allOf:
            - $ref: '#/components/schemas/KeyScope'
          description: |
            Visible in the token itself, so a scope mismatch is not a debugging session. Issuance
            is an admin action and is audited, and it is a per-customer decision: a runtime key
            with no `tenant_external_id` is a credential for the whole instance.
        tenant_external_id:
          allOf:
            - $ref: '#/components/schemas/ExternalId'
          description: |
            Optional, runtime keys only: the one tenant the key can address (DR-053). With
            `scope: admin` it is `400 validation_failed` naming this field. An unknown tenant is
            `404 tenant_not_found` and a deleted one `409 tenant_deleted`.
        expires_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: Optional. An expiry is a limit on a credential's blast radius.

    KeyCreated:
      type: object
      description: |
        The **only** response that ever contains the plaintext key. It is not recoverable
        afterwards; only a SHA-256 digest of the secret and the public prefix are stored, and the
        digest is deliberately not indexed because indexing a verifier invites a timing-oracle
        design (ADR-0018).

        A lost key is replaced, not recovered (UC-15).
      additionalProperties: false
      required: [id, name, prefix, scope, state, tenant_external_id, created_at, expires_at, key]
      properties:
        id:
          type: string
          format: uuid
          description: The new key's id, as it appears in every later `Key` response.
        name:
          type: string
          description: The name chosen at creation, echoed back.
        prefix:
          type: string
          description: The public prefix, so it can be recorded where the key cannot.
        scope:
          $ref: '#/components/schemas/KeyScope'
        state:
          $ref: '#/components/schemas/KeyState'
        tenant_external_id:
          oneOf:
            - $ref: '#/components/schemas/ExternalId'
            - type: 'null'
          description: The tenant the key is bound to, or null for an unbound key (DR-053).
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        key:
          type: string
          description: |
            The plaintext credential, in the form `qc_<scope>_<prefix>.<secret>`. Shown once.
          pattern: '^qc_(runtime|admin)_[0-9a-f]{8,64}\.[A-Za-z0-9_-]{16,}$'

    KeyList:
      description: |
        A page of key metadata. The secret is never present, and no route will return it (INV-K3).
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          description: The page of keys. An empty page is `[]`, never `null`.
          items:
            $ref: '#/components/schemas/Key'
        next_cursor:
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'

    DependencyHealth:
      type: object
      description: |
        One dependency's health, reported as data. A failure here is a `200` with
        `healthy: false`, never an error envelope, because a status endpoint that fails when a
        dependency is down cannot report that it is down.
      additionalProperties: false
      required: [name, healthy, latency_ms, error]
      properties:
        name:
          type: string
          enum: [redis, postgres]
          description: Which dependency this row is about.
        healthy:
          type: boolean
          description: |
            Whether a probe succeeded. `false` is reported here rather than as an error envelope,
            so the status endpoint can still answer the question that was asked of it.
        latency_ms:
          oneOf:
            - type: number
              format: double
              minimum: 0
            - type: 'null'
          description: The probe's round-trip time, or null when the probe did not complete.
        error:
          oneOf:
            - type: string
            - type: 'null'
          description: 'The failure reason, and safe to show: it is a connection error, not data.'

    CacheStats:
      type: object
      description: |
        The configuration snapshot's size. An empty key space after a restart is a normal state and
        it is reported as such rather than inferred from a failing request.
      additionalProperties: false
      required: [entries, tenants, features, size_bytes]
      properties:
        entries:
          type: integer
          format: int64
          minimum: 0
          description: Configuration entries held in the snapshot, across all tenants and features.
        tenants:
          type: integer
          format: int64
          minimum: 0
          description: Tenants the snapshot currently covers. Zero right after a restart is normal.
        features:
          type: integer
          format: int64
          minimum: 0
          description: Features the snapshot currently covers.
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            Approximate memory held by the snapshot. Sizing the store needs this number, which is
            why it is reported rather than estimated by a reader.

    Status:
      type: object
      description: |
        Everything an operator needs when something is wrong, in one call: dependency health, the
        build, the `tzdata` version the binary was built with, the current time and the snapshot
        size (NFR-O5).

        The `tzdata` version is reported because a boundary disagreement between a node and the
        reference tables is diagnosable if you know which tables the node used, and is not
        diagnosable otherwise (ADR-0007).
      additionalProperties: false
      required: [status, mode, version, commit, zone_data_version, server_time, uptime_s, dependencies, cache, queue_depth, worker, ledger_dropped_total]
      properties:
        status:
          type: string
          description: |
            A single word for a dashboard. Read `dependencies` for the detail: one word cannot say
            which dependency is down, and a status that cannot is the status that gets ignored.
          enum: [ok, degraded]
        mode:
          type: string
          description: |
            `readonly` while this instance was started with `QUOTACORE_STARTUP_MODE=readonly` for a
            rebuild, or has lost its hold on the rebuild fence; it then refuses every write to a
            tenant's balances and idempotency records with `503 service_unavailable`, and
            `/readyz` is not ready. `normal` otherwise (consistency-and-recovery.md section 4.1,
            added 2026-10-20).
          enum: [normal, readonly]
        version:
          type: string
          description: The build version.
        commit:
          type: string
          description: The build commit, so a running binary is traceable to a source tree.
        zone_data_version:
          type: string
          description: The `tzdata` version the binary was built with.
        server_time:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: |
            The service's own time, so a client that disagrees can see the discrepancy instead of
            computing a silent one.
        uptime_s:
          type: integer
          format: int64
          minimum: 0
          description: |
            Seconds since this process started, which is not the same as seconds since the
            service was last healthy. A restart is visible here and not in `status`.
        dependencies:
          type: array
          description: |
            One row per dependency, and the reason to read this endpoint at all: the detail behind
            the one word in `status`.
          items:
            $ref: '#/components/schemas/DependencyHealth'
        cache:
          $ref: '#/components/schemas/CacheStats'
        queue_depth:
          type: integer
          format: int64
          minimum: 0
          description: |
            The ledger queue's current depth on the instance that answered: events accepted and
            not yet written. Growth toward `QUOTACORE_EVENT_QUEUE_SIZE` means the writer is behind,
            and drops follow (ADR-0016).
        worker:
          type: string
          description: |
            The ledger writer's state on the instance that answered: `running`, `draining` while a
            shutdown writes what is queued, and `stopped` before it starts or after it has drained.
          enum: [running, stopped, draining]
        ledger_dropped_total:
          type: integer
          format: int64
          minimum: 0
          description: |
            Ledger events this instance dropped since it started, over every reason. **Non-zero
            means the history is incomplete**, and that is reported rather than hidden, because a
            silently incomplete history is worse than a documented one (ADR-0016). An event the
            ledger refused is kept as a dead letter, not counted here.

    HealthResponse:
      type: object
      description: |
        The probe response. Deliberately minimal: a liveness probe that inspects dependencies
        restarts a process that was not the problem.
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready]
          description: |
            `ok` from the liveness probe, `ready` from the readiness probe. The two differ
            deliberately: a process that is alive but not ready is still the right process to keep
            running.
