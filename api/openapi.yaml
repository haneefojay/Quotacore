  /v1/admin/tenants/{id}/grant:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
    post:
      tags: [admin-tenants]
      operationId: grantTenant
      summary: Add bonus quota for the current cycle
      description: |
        Adds `amount` to both `balance` and `bonus` in the current cycle, after any rollover that
        is due, and applies immediately. Because both rise together, `balance <= limit + bonus`
        holds by construction and a grant to a full balance succeeds. A grant is
        **cycle-scoped**: it does not survive the boundary, because a bonus is a gesture and a
        limit is a contract (DR-019, DR-020).

        A grant on a `never` entitlement increases the balance with no cycle to end it.

        `409 grant_exceeds_ceiling` is a grant that would take the balance or the bonus past
        `2^53 - 1`, the largest amount the service represents exactly (DR-022). To raise a limit
        durably, use an override, which is the correct remedy for a lasting increase.

        A grant has no `version` and no `Idempotency-Key`, so a grant retried after a timeout is a
        second grant; each is in the audit log with its reason.
      security:
        - bearerAuth: []
      x-required-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantRequest'
            examples:
              grant:
                summary: Goodwill for an outage
                value:
                  feature_key: llm.tokens.output
                  amount: 50000
                  reason: incident INC-2211, 30 minutes of failed responses
      responses:
        '200':
          $ref: '#/components/responses/BalanceEntryOK'
